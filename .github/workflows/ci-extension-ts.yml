name: extension-typecheck

on:
  push:
    branches: [master]
    paths: ["extension/**", ".github/workflows/extension-typecheck.yml"]
  pull_request:
    paths: ["extension/**", ".github/workflows/extension-typecheck.yml"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install theoses2 typings (src only, no build)
        run: git clone --depth 1 https://github.com/H4fizWasabie/theoses2.git /tmp/theoses2

      - name: Run tsc --noEmit over extension/
        run: |
          cd extension
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "allowImportingTsExtensions": true,
              "noEmit": true,
              "strict": true,
              "skipLibCheck": true,
              "types": ["node"],
              "paths": { "theoses-coding-agent": ["/tmp/theoses2/src/index.ts"] }
            },
            "include": ["*.ts"]
          }
          EOF
          npx -y typescript@5.6 tsc -p tsconfig.json
