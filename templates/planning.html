{{template "base.html" .}}
{{define "content_planning"}}
<div class="top-bar">
    <h2>Planning</h2>
    <div style="display:flex;gap:8px">
        <button id="rfq-btn" onclick="createRFQ()" disabled>Create RFQ</button>
        <button id="order-btn" onclick="markOrdered()" disabled>Mark Ordered</button>
    </div>
</div>

<div class="search-bar">
    <input type="text" id="filter" placeholder="Search name, ID, supplier..." oninput="render()" style="flex:1">
    <select id="f-supplier" style="width:160px" onchange="render()"><option value="">All Suppliers</option></select>
    <select id="f-type" style="width:140px" onchange="render()"><option value="">All Types</option></select>
    <select id="f-category" style="width:150px" onchange="render()"><option value="">All Categories</option></select>
    <select id="f-status" style="width:120px" onchange="render()"><option value="">All Status</option></select>
</div>

<table>
    <thead><tr>
        <th><input type="checkbox" id="select-all" onchange="toggleAll(this)"></th>
        <th>Stock ID</th><th>Item</th><th>Supplier</th><th>Category</th>
        <th>Current</th><th>ROP</th><th>Health</th><th>Velocity</th>
        <th>Status</th><th>Suggested</th><th>Cost</th>
    </tr></thead>
    <tbody id="plan-body"></tbody>
</table>

<div id="toast" class="toast" style="display:none"></div>

<script>
let data = [], selected = new Set();

async function load() {
    const res = await fetch('/api/planning');
    data = await res.json();
    selected.clear();
    fillOptions();
    render();
}

function fillOptions() {
    const uniq = arr => [...new Set(arr.filter(Boolean))].sort();
    const set = (id, label, vals) => {
        const sel = document.getElementById(id);
        const cur = sel.value;
        sel.innerHTML = '<option value="">' + label + '</option>' + vals.map(v => `<option>${esc(v)}</option>`).join('');
        sel.value = cur; // keep selection across reloads
    };
    set('f-supplier', 'All Suppliers', uniq(data.map(i => i.supplier)));
    set('f-type', 'All Types', uniq(data.map(i => i.productType)));
    set('f-category', 'All Categories', uniq(data.map(i => i.category)));
    set('f-status', 'All Status', uniq(data.map(i => i.status)));
}

function matches(it) {
    const q = (document.getElementById('filter').value || '').toLowerCase();
    if (q && !(it.id||'').toLowerCase().includes(q) && !(it.name||'').toLowerCase().includes(q)
            && !(it.supplier||'').toLowerCase().includes(q) && !(it.category||'').toLowerCase().includes(q)) return false;
    const v = id => document.getElementById(id).value;
    if (v('f-supplier') && (it.supplier||'') !== v('f-supplier')) return false;
    if (v('f-type') && (it.productType||'') !== v('f-type')) return false;
    if (v('f-category') && (it.category||'') !== v('f-category')) return false;
    if (v('f-status') && (it.status||'') !== v('f-status')) return false;
    return true;
}

function render() {
    const filtered = data.filter(matches);

    const tbody = document.getElementById('plan-body');
    tbody.innerHTML = filtered.length ? filtered.map((it, idx) => `
        <tr>
            <td><input type="checkbox" ${selected.has(it.id) ? 'checked' : ''} onchange="toggle('${esc(it.id)}', this.checked)"></td>
            <td>${esc(it.id)}</td>
            <td>${esc(it.name)}</td>
            <td>${esc(it.supplier || '-')}</td>
            <td>${esc(it.category || '-')}</td>
            <td class="money">${it.current || 0}</td>
            <td class="money">${it.rop || 0}</td>
            <td><span class="badge ${it.health <= 25 ? 'badge-red' : it.health <= 50 ? 'badge-amber' : 'badge-green'}">${it.health.toFixed(0)}%</span></td>
            <td><span class="badge ${it.velocityClass === 'FAST' ? 'badge-green' : it.velocityClass === 'SLOW' ? 'badge-red' : 'badge-amber'}">${it.velocityClass || 'MEDIUM'}</span></td>
            <td><span class="badge ${it.status === 'CRITICAL' ? 'badge-red' : 'badge-amber'}">${it.status}</span></td>
            <td class="money">${it.suggested > 0 ? it.suggested.toFixed(0) : '-'}</td>
            <td class="money">${it.cost ? 'RM ' + it.cost.toFixed(2) : '-'}</td>
        </tr>
    `).join('') : '<tr><td colspan="12" style="text-align:center;color:var(--muted)">No items match filters</td></tr>';

    document.getElementById('order-btn').disabled = selected.size === 0;
    document.getElementById('rfq-btn').disabled = selected.size === 0;
}

function toggle(id, on) { on ? selected.add(id) : selected.delete(id); render(); }
function toggleAll(el) {
    data.forEach(it => { if (matches(it)) el.checked ? selected.add(it.id) : selected.delete(it.id); });
    render();
}

function createRFQ() {
    if (!selected.size) return;
    const draftItems = data.filter(it => selected.has(it.id)).map(it => ({
        stock_id: it.id,
        item_name: it.name,
        uom: it.uom || 'UNIT',
        qty: it.suggested > 0 ? it.suggested : 1,
        supplier: it.supplier || '',
    }));
    const suppliers = [...new Set(draftItems.map(it => it.supplier).filter(Boolean))];
    const draftSupplier = suppliers.length === 1 ? suppliers[0] : '';
    if (suppliers.length > 1) {
        toast('Warning: ' + suppliers.length + ' different suppliers selected. RFQ supplier left blank.', true);
    }
    sessionStorage.setItem('rfqDraft', JSON.stringify({supplier: draftSupplier, items: draftItems}));
    window.location.href = '/rfq';
}

async function markOrdered() {
    const items = data.filter(it => selected.has(it.id)).map(it => ({
        stockId: it.id, name: it.name, supplier: it.supplier,
        qty: Math.max(it.suggested, 1)
    }));
    if (!items.length) return;
    const supplier = items[0].supplier;

    try {
        const res = await fetch('/api/planning/order', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({items, notes: 'Ordered from planning, supplier: ' + (supplier || 'unknown')})
        });
        const d = await res.json();
        toast(d.success ? 'Order ' + d.orderId + ' created (' + items.length + ' items)' : d.error, d.success);
        if (d.success) load();
    } catch(e) { toast('Error: ' + e.message, false); }
}

function toast(msg, ok) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
    t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000);
}
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
load();
</script>
{{end}}
