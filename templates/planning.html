{{template "base.html" .}}
{{define "content_planning"}}
<div class="top-bar">
    <h2>Planning</h2>
    <div style="display:flex;gap:8px">
        <button id="rfq-btn" onclick="createRFQ()" disabled>Create RFQ</button>
        <button id="order-btn" onclick="markOrdered()" disabled>Mark Ordered</button>
    </div>
</div>

<div class="search-bar">
    <div id="data-note" style="color:var(--muted);font-size:13px;flex:1"></div>
    <input type="text" id="filter" placeholder="Search name, ID, supplier..." oninput="render()" style="flex:1">
    <select id="f-supplier" style="width:160px" onchange="render()"><option value="">All Suppliers</option></select>
    <select id="f-type" style="width:140px" onchange="render()"><option value="">All Types</option></select>
    <select id="f-category" style="width:150px" onchange="render()"><option value="">All Categories</option></select>
    <select id="f-status" style="width:120px" onchange="render()"><option value="">All Status</option></select>
    <select id="f-onorder" style="width:130px" onchange="render()">
        <option value="">All Items</option>
        <option value="hide">Hide On Order</option>
        <option value="only">On Order Only</option>
    </select>
</div>

<table>
    <thead><tr>
        <th><input type="checkbox" id="select-all" onchange="toggleAll(this)"></th>
        <th>Stock ID</th><th>Item</th><th>Supplier</th>
        <th>Current</th><th>ROP</th><th>Health</th><th>Vel/mo</th>
        <th>Status</th><th>Confidence</th><th>In Flight</th><th>Suggested Qty</th><th>Cost</th>
    </tr></thead>
    <tbody id="plan-body"></tbody>
</table>

<div class="top-bar" style="margin-top:24px"><h2>In-Flight Direct Orders</h2></div>
<table>
    <thead><tr><th>Order ID</th><th>Ordered</th><th>Age</th><th>Items</th><th>Status</th><th style="width:200px"></th></tr></thead>
    <tbody id="orders-body"><tr><td colspan="6" style="text-align:center;color:var(--muted)">Loading…</td></tr></tbody>
</table>

<div id="toast" class="toast" style="display:none"></div>

<script>
let data = [], selected = new Set();

async function load() {
    const res = await fetch('/api/planning');
    const d = await res.json();
    data = d.items || d;
    document.getElementById('data-note').textContent = d.dataThrough ? `Velocity & ROP based on movements through ${d.dataThrough}` : '';
    selected.clear();
    fillOptions();
    render();
    loadOrders();
}

async function loadOrders() {
    const res = await fetch('/api/planning/orders');
    const orders = await res.json();
    const active = orders.filter(o => !o.supersededByPo);
    document.getElementById('orders-body').innerHTML = active.length ? active.map(o => {
        const items = o.items.map(i => `${esc(i.name)} ×${i.qty}`).join(', ');
        const stale = o.daysOpen > 30;
        return `<tr>
            <td>${esc(o.orderId)}</td>
            <td>${(o.date||'').slice(0,10)}</td>
            <td>${o.daysOpen}d ${stale ? '<span class="badge badge-red">stale</span>' : ''}</td>
            <td>${items}</td>
            <td>${esc(o.status)}</td>
            <td>
                ${o.status === 'ACTIVE' ? `
                <button class="btn-sm" onclick="orderAction('deliver','${esc(o.orderId)}')">Delivered</button>
                <button class="btn-sm" onclick="orderAction('cancel','${esc(o.orderId)}')">Cancel</button>` : ''}
            </td>
        </tr>`;
    }).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted)">Nothing in flight</td></tr>';
}

async function orderAction(action, orderId) {
    const res = await fetch('/api/planning/order/' + action, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({orderId})
    });
    const d = await res.json();
    toast(d.success ? 'Order ' + action + 'd' : d.error, d.success);
    if (d.success) { load(); }
}

function fillOptions() {
    const uniq = arr => [...new Set(arr.filter(Boolean))].sort();
    const set = (id, label, vals) => {
        const sel = document.getElementById(id);
        const cur = sel.value;
        sel.innerHTML = '<option value="">' + label + '</option>' + vals.map(v => `<option>${esc(v)}</option>`).join('');
        sel.value = cur;
    };
    set('f-supplier', 'All Suppliers', uniq(data.map(i => i.supplier)));
    set('f-type', 'All Types', uniq(data.map(i => i.productType)));
    set('f-category', 'All Categories', uniq(data.map(i => i.category)));
    set('f-status', 'All Status', uniq(data.map(i => i.status)));
}

function matches(it) {
    const q = (document.getElementById('filter').value || '').toLowerCase();
    if (q && !(it.id||'').toLowerCase().includes(q) && !(it.name||'').toLowerCase().includes(q)
            && !(it.supplier||'').toLowerCase().includes(q) && !(it.category||'').toLowerCase().includes(q)) return false;
    const v = id => document.getElementById(id).value;
    if (v('f-supplier') && (it.supplier||'') !== v('f-supplier')) return false;
    if (v('f-type') && (it.productType||'') !== v('f-type')) return false;
    if (v('f-category') && (it.category||'') !== v('f-category')) return false;
    if (v('f-status') && (it.status||'') !== v('f-status')) return false;
    if (v('f-onorder') === 'hide' && it.onOrder) return false;
    if (v('f-onorder') === 'only' && !it.onOrder) return false;
    return true;
}

const confBadge = c => c === 'HIGH' ? 'badge-green' : c === 'LOW' ? 'badge-amber' : 'badge-red';
const statusBadge = s => s === 'CRITICAL' ? 'badge-red' : s === 'REVIEW' ? 'badge-red' : 'badge-amber';
const stageLabel = {PO: 'on', DIRECT: 'direct', RFQ: 'rfq'};

function render() {
    const filtered = data.filter(matches);

    const tbody = document.getElementById('plan-body');
    tbody.innerHTML = filtered.length ? filtered.map(it => `
        <tr>
            <td><input type="checkbox" ${selected.has(it.id) ? 'checked' : ''} onchange="toggle('${esc(it.id)}', this.checked)"></td>
            <td>${esc(it.id)}</td>
            <td>${esc(it.name)}${it.onOrder ? ` <span title="${esc(breakdown(it))}" class="badge badge-green">ON ORDER</span>` : ''}</td>
            <td>${esc(it.supplier || '-')}</td>
            <td class="money">${it.current || 0}</td>
            <td class="money">${it.rop || 0}</td>
            <td><span class="badge ${it.health <= 25 ? 'badge-red' : it.health <= 50 ? 'badge-amber' : 'badge-green'}">${it.health.toFixed(0)}%</span></td>
            <td class="money">${it.velocity > 0 ? it.velocity.toFixed(1) : '-'}</td>
            <td><span class="badge ${statusBadge(it.status)}">${it.status}</span></td>
            <td><span class="badge ${confBadge(it.confidence)}">${it.confidence || ''}</span></td>
            <td class="money">${it.incomingQty > 0 ? it.incomingQty.toFixed(0) : '-'}</td>
            <td class="money">
                ${it.suggested > 0
                    ? `<input type="number" min="0" value="${it.suggested.toFixed(0)}" style="width:70px" onchange="setQty('${esc(it.id)}', this.value)">`
                    : `<span title="${it.confidence === 'MANUAL' ? 'Too little history — enter qty when ordering' : 'Already covered by incoming stock'}">-</span>`}
            </td>
            <td class="money">${it.cost ? 'RM ' + it.cost.toFixed(2) : '-'}</td>
        </tr>
    `).join('') : '<tr><td colspan="13" style="text-align:center;color:var(--muted)">No items match filters</td></tr>';

    document.getElementById('order-btn').disabled = selected.size === 0;
    document.getElementById('rfq-btn').disabled = selected.size === 0;
}

function breakdown(it) {
    return it.incoming.map(i => `${i.qty} ${stageLabel[i.stage] || i.stage.toLowerCase()} ${i.ref}`).join(' · ');
}

let qtys = {};
function setQty(id, val) { qtys[id] = parseFloat(val) || 0; }

function toggle(id, on) { on ? selected.add(id) : selected.delete(id); render(); }
function toggleAll(el) {
    data.forEach(it => { if (matches(it)) el.checked ? selected.add(it.id) : selected.delete(it.id); });
    render();
}

function createRFQ() {
    if (!selected.size) return;
    // Explicit payload: supplier is chosen on the RFQ page (fully manual).
    const draftItems = data.filter(it => selected.has(it.id)).map(it => ({
        stock_id: it.id,
        item_name: it.name,
        uom: it.uom || 'UNIT',
        qty: qtys[it.id] || (it.suggested > 0 ? it.suggested : 1),
    }));
    sessionStorage.setItem('rfqDraft', JSON.stringify({supplier: '', items: draftItems}));
    window.location.href = '/rfq';
}

async function markOrdered() {
    if (!selected.size) return;
    const items = data.filter(it => selected.has(it.id)).map(it => ({
        stockId: it.id, name: it.name,
        qty: qtys[it.id] || (it.suggested > 0 ? it.suggested : 1)
    }));
    const supplier = prompt('Supplier for this direct order:', data.find(it => it.id === items[0].stockId)?.supplier || '');
    if (supplier === null) return;

    try {
        const res = await fetch('/api/planning/order', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({items, supplier, notes: 'Ordered from planning'})
        });
        const d = await res.json();
        toast(d.success ? 'Order ' + d.orderId + ' created (' + items.length + ' items)' : d.error, d.success);
        if (d.success) load();
    } catch(e) { toast('Error: ' + e.message, false); }
}

function toast(msg, ok) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
    t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000);
}
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
load();
</script>
{{end}}
