{{template "base.html" .}}
{{define "content_movement"}}
<div class="top-bar">
    <h2>Stock Movement</h2>
    <div style="display:flex;gap:8px;align-items:center">
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)">
            <input type="checkbox" id="auto-rop" checked> Auto-recalc ROP after import
        </label>
        <button onclick="recalcRop()" id="rop-btn">Recalculate ROP</button>
    </div>
</div>

<div class="search-bar">
    <select id="m-year" onchange="loadMovements()"></select>
    <select id="m-month" onchange="loadMovements()">
        <option value="">All Months</option>
    </select>
    <input type="text" id="m-search" placeholder="Search stock ID or item name" oninput="loadMovements()">
    <button onclick="loadMovements()">Refresh</button>
    <button onclick="document.getElementById('upload-input').click()" id="upload-btn">Upload Data</button>
    <input type="file" id="upload-input" accept=".xlsx" style="display:none" onchange="uploadMovement(this)">
    <button class="btn-secondary" onclick="exportMovement('csv')">Export CSV</button>
</div>

<div id="upload-preview" class="card" style="display:none;margin-bottom:12px"></div>

<div class="card" style="padding:0;overflow-x:auto;max-height:60vh;overflow-y:auto">
    <table>
        <thead><tr id="movement-header"></tr></thead>
        <tbody id="movement-body"></tbody>
    </table>
</div>

<div class="pagination">
    <button onclick="goMovPage(movPage-1)" id="mov-prev">Prev</button>
    <span id="mov-page-info"></span>
    <button onclick="goMovPage(movPage+1)" id="mov-next">Next</button>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script>
let movData=[], movPage=1, movPageSize=100, selectedYear=0, selectedMonth=0;
const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

async function initMovement() {
    // Populate years
    const yrRes = await fetch('/api/movement/years');
    const years = await yrRes.json();
    document.getElementById('m-year').innerHTML = '<option value="">All Years</option>' +
        years.map(y => `<option>${y}</option>`).join('');
    if (years.length) document.getElementById('m-year').value = years[0];
    // Populate months
    document.getElementById('m-month').innerHTML = '<option value="">All Months</option>' +
        months.map((m,i) => `<option value="${i+1}">${m}</option>`).join('');
    loadMovements();
}

async function loadMovements() {
    selectedYear = parseInt(document.getElementById('m-year').value)||0;
    selectedMonth = parseInt(document.getElementById('m-month').value)||0;
    const params = new URLSearchParams({limit:5000});
    if (selectedYear) params.set('year', selectedYear);
    if (selectedMonth) params.set('month', selectedMonth);
    const search = document.getElementById('m-search').value.trim();
    if (search) params.set('search', search);

    movData = await (await fetch('/api/movement?'+params)).json();
    if (!Array.isArray(movData)) movData = [];

    // Pivot: group by stock_id, build month columns
    let monthCols = [];
    if (selectedYear && selectedMonth) {
        monthCols = [{year:selectedYear,month:selectedMonth}];
    } else {
        // Build month column list from returned data
        const seen = new Set();
        movData.forEach(r => seen.add(`${r.year}-${r.month}`));
        [...seen].sort().forEach(k => { const [y,m]=k.split('-'); monthCols.push({year:+y,month:+m}); });
    }

    const byStock = {};
    movData.forEach(r => {
        const key = r.stock_id||'';
        if (!byStock[key]) byStock[key] = {stock_id:r.stock_id, item_name:r.item_name, months:{}, totalIn:0, totalOut:0, totalAdj:0, totalClosing:0};
        const mk = `${r.year}-${r.month}`;
        byStock[key].months[mk] = r;
        byStock[key].totalIn += (r.in_qty||0);
        byStock[key].totalOut += (r.out_qty||0);
        byStock[key].totalAdj += (r.adj_in||0)-(r.adj_out||0);
        byStock[key].totalClosing = r.report_closing||0;
    });

    const stocks = Object.values(byStock);

    // Build header
    const header = document.getElementById('movement-header');
    header.innerHTML = '<th>Stock ID</th><th>Item Name</th>';
    monthCols.forEach(mc => {
        header.innerHTML += `<th colspan="5" style="text-align:center">${months[mc.month-1]} ${mc.year}</th>`;
    });
    header.innerHTML += '<th class="text-right">Total IN</th><th class="text-right">Total OUT</th><th class="text-right">Total ADJ</th><th class="text-right">Closing</th>';

    // Paginate
    const totalPages = Math.ceil(stocks.length/movPageSize)||1;
    if (movPage > totalPages) movPage = totalPages;
    if (movPage < 1) movPage = 1;
    const pageData = stocks.slice((movPage-1)*movPageSize, movPage*movPageSize);
    document.getElementById('mov-page-info').textContent = `Page ${movPage} of ${totalPages}`;
    document.getElementById('mov-prev').disabled = movPage <= 1;
    document.getElementById('mov-next').disabled = movPage >= totalPages;

    // Build body
    const tbody = document.getElementById('movement-body');
    tbody.innerHTML = pageData.map(s => {
        let row = `<tr><td style="font-family:monospace;font-weight:600">${esc(s.stock_id)}</td><td>${esc(s.item_name||'')}</td>`;
        monthCols.forEach(mc => {
            const mk = `${mc.year}-${mc.month}`;
            const m = s.months[mk] || {};
            row += `<td class="text-right">${m.in_qty||0}</td>
                    <td class="text-right" style="color:var(--amber)">${m.out_qty||0}</td>
                    <td class="text-right">${m.adj_in||0}</td>
                    <td class="text-right" style="color:var(--amber)">${m.adj_out||0}</td>
                    <td class="text-right" style="color:var(--accent)">${m.report_closing||0}</td>`;
        });
        row += `<td class="text-right">${s.totalIn||0}</td>
                <td class="text-right" style="color:var(--amber)">${s.totalOut||0}</td>
                <td class="text-right">${s.totalAdj||0}</td>
                <td class="text-right" style="color:var(--accent)">${s.totalClosing||0}</td></tr>`;
        return row;
    }).join('') || '<tr><td colspan="10" style="padding:40px;text-align:center;color:var(--muted)">No movement data for selected period</td></tr>';
}

function goMovPage(p) { movPage = p; loadMovements(); }

// Bulk upload via save endpoint with existing data check
async function uploadMovement(input) {
    const file = input.files[0]; if (!file) return;
    if (!selectedYear || !selectedMonth) return toast('Select year and month first', false);

    // Check existing data
    const existing = movData.filter(r => r.year===selectedYear && r.month===selectedMonth);
    const preview = document.getElementById('upload-preview');
    preview.style.display = 'block';
    preview.innerHTML = `<h4>Upload Preview</h4>
        <p>Year: ${selectedYear}, Month: ${months[selectedMonth-1]}</p>
        <p style="color:${existing.length?'var(--amber)':'var(--muted)'}">${existing.length ? existing.length+' existing rows will be replaced' : 'No existing data for this month'}</p>
        <div style="display:flex;gap:8px;margin-top:8px">
            <button onclick="confirmUpload('${file.name}')">Confirm Upload</button>
            <button class="btn-secondary" onclick="cancelUpload()">Cancel</button>
        </div>`;
}

function cancelUpload() { document.getElementById('upload-preview').style.display='none'; document.getElementById('upload-input').value = ''; }

async function confirmUpload(filename) {
    document.getElementById('upload-preview').style.display='none';
    const input = document.getElementById('upload-input');
    const file = input.files[0];
    if (!file) return toast('No file selected', false);
    if (typeof XLSX === 'undefined') return toast('XLSX library not loaded — check internet connection', false);
    
    const reader = new FileReader();
    reader.onerror = function() { toast('Failed to read file', false); };
    reader.onload = async function(e) {
        try {
            const wb = XLSX.read(e.target.result, {type:'array'});
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, {header:1});
            if (rows.length < 2) return toast('File has no data rows', false);
            
            const hdr = rows[0].map(h => String(h||'').toLowerCase().trim());
            const idx = (names) => { for(let n of names) { const i = hdr.indexOf(n); if(i>=0) return i } return -1 };
            const si = idx(['sku code','stock id']);
            const ni = idx(['product name','item name']);
            const ii = idx(['purchase quantity','in qty']);
            const oi = idx(['sales quantity','out qty']);
            const ai = idx(['adjustment in','adj in']);
            const ao = idx(['adjustment out','adj out']);
            const ci = idx(['closing balance','report closing','closing']);
            if (si<0) return toast('Missing SKU Code column. Headers: '+hdr.slice(0,5).join(', '), false);
            
            const bulkRows = [];
            for(let r=1; r<rows.length; r++) {
                const row = rows[r];
                const sid = String(row[si]||'').trim();
                if (!sid) continue;
                bulkRows.push({
                    stock_id: sid,
                    item_name: String(row[ni]||'').trim(),
                    in: parseFloat(row[ii])||0,
                    out: parseFloat(row[oi])||0,
                    adj_in: parseFloat(row[ai])||0,
                    adj_out: parseFloat(row[ao])||0,
                    closing: parseFloat(row[ci])||0
                });
            }
            if (!bulkRows.length) return toast('No valid rows found', false);
            
            const res = await fetch('/api/movement/bulk', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({year:selectedYear, month:selectedMonth, rows:bulkRows})
            });
            const d = await res.json();
            if (d.success) { toast(`Imported ${d.count} rows`, true); loadMovements(); input.value = ''; }
            else { toast('Error: '+d.error, false); }
        } catch(e) { toast('Parse error: '+e.message, false); console.error(e); }
    };
    reader.readAsArrayBuffer(file);
}

async function recalcRop() {
    const btn = document.getElementById('rop-btn');
    btn.disabled = true; btn.textContent = 'Calculating...';
    const res = await fetch('/api/movement/rop', {method:'POST'});
    const d = await res.json();
    btn.disabled = false; btn.textContent = 'Recalculate ROP';
    toast(d.success ? `ROP updated: ${d.updated} items` : 'Error', d.success);
}

function exportMovement(fmt) {
    let csv = 'Stock ID,Item Name,Year,Month,IN,OUT,ADJ IN,ADJ OUT,Closing\n';
    movData.forEach(r => csv += `${r.stock_id},${r.item_name},${r.year},${r.month},${r.in_qty||0},${r.out_qty||0},${r.adj_in||0},${r.adj_out||0},${r.report_closing||0}\n`);
    const b = new Blob([csv],{type:'text/csv'}); const a = document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='movement.csv'; a.click();
}

function toast(m,ok){const t=document.getElementById('toast');t.textContent=m;t.className='toast '+(ok?'toast-ok':'toast-err');t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
initMovement();
</script>
{{end}}
