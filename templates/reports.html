{{template "base.html" .}}
{{define "content_reports"}}
<div class="top-bar"><h2>Reports</h2></div>

<!-- Tabs -->
<div style="display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--border)">
    <button class="sub-tab active" onclick="switchTab('general')">General Reports</button>
    <button class="sub-tab" onclick="switchTab('history')">Item History</button>
</div>

<!-- General Reports Tab -->
<div id="tab-general">
    <div class="search-bar">
        <select id="r-type" onchange="loadReport()">
            <option value="restock">Restock Needed</option>
            <option value="closing_stock">Closing Stock</option>
            <option value="consumption">Consumption</option>
        </select>
        <select id="r-year" onchange="loadReport()"></select>
        <select id="r-month" onchange="loadReport()">
            <option value="0">All Months</option>
        </select>
        <button class="btn-secondary" onclick="exportReportCSV()">Export CSV</button>
    </div>

    <div class="card" style="padding:0;overflow-x:auto">
        <table>
            <thead><tr><th>SKU</th><th>Item</th><th>Type</th><th>Category</th><th class="text-right">Qty</th><th class="text-right">Cost</th><th class="text-right">Total Value</th></tr></thead>
            <tbody id="report-body"></tbody>
            <tfoot id="report-foot"></tfoot>
        </table>
    </div>
    <div class="pagination">
        <button onclick="goRepPage(repPage-1)" id="rep-prev">Prev</button>
        <span id="rep-info"></span>
        <button onclick="goRepPage(repPage+1)" id="rep-next">Next</button>
    </div>
</div>

<!-- Item History Tab -->
<div id="tab-history" style="display:none">
    <div class="search-bar">
        <input type="text" id="ih-search" placeholder="Type item name and press Enter..." style="width:300px" onkeydown="if(event.key==='Enter')searchPoItems()">
        <button onclick="searchPoItems()">Search PO Items</button>
    </div>
    <div id="ih-results" style="margin-bottom:12px"></div>
    <button onclick="runItemHistory()" id="ih-run-btn" style="display:none">Run Item History Report</button>
    <div id="ih-report" class="card" style="padding:0;overflow-x:auto;margin-top:12px">
        <table>
            <thead><tr><th>Stock ID</th><th>Item</th><th>Last PO</th><th>Last Buy Date</th><th class="text-right">Qty</th><th class="text-right">Cost</th><th class="text-right">Total</th></tr></thead>
            <tbody id="ih-body"></tbody>
        </table>
    </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<style>
.sub-tab{padding:10px 20px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px}
.sub-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.text-right{text-align:right}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
</style>

<script>
const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let repPage=1, repPageSize=50, repType='restock', selectedPOItems=[];

async function initReports() {
    // Populate years from movement data
    const yrRes = await fetch('/api/movement/years');
    let years = await yrRes.json();
    if (!years.length) years = [new Date().getFullYear()];
    document.getElementById('r-year').innerHTML = years.map(y => `<option>${y}</option>`).join('');
    document.getElementById('r-month').innerHTML = '<option value="0">All Months</option>' +
        months.map((m,i) => `<option value="${i+1}">${m}</option>`).join('');
    // Set current month
    const now = new Date();
    document.getElementById('r-year').value = now.getFullYear();
    document.getElementById('r-month').value = now.getMonth()+1;
    loadReport();
}

function switchTab(name) {
    document.getElementById('tab-general').style.display = name==='general'?'block':'none';
    document.getElementById('tab-history').style.display = name==='history'?'block':'none';
    document.querySelectorAll('.sub-tab').forEach((b,i) => b.classList.toggle('active', i===['general','history'].indexOf(name)));
}

async function loadReport() {
    repType = document.getElementById('r-type').value;
    const year = parseInt(document.getElementById('r-year').value)||0;
    const month = parseInt(document.getElementById('r-month').value)||0;

    let url;
    if (repType === 'restock') {
        url = `/api/reports/restock?page=${repPage}&pageSize=${repPageSize}`;
    } else {
        url = `/api/reports/historical?type=${repType}&year=${year}&month=${month}&page=${repPage}&pageSize=${repPageSize}`;
    }
    const res = await fetch(url);
    const d = await res.json();
    const data = d.data || [];
    document.getElementById('report-body').innerHTML = data.map(r => `
        <tr><td style="font-family:monospace;font-weight:600">${esc(r.sku)}</td><td>${esc(r.name)}</td>
        <td>${esc(r.type)}</td><td>${esc(r.category)}</td>
        <td class="text-right">${r.qty.toFixed(0)}</td>
        <td class="text-right">RM ${r.cost.toFixed(2)}</td>
        <td class="text-right" style="font-weight:600">RM ${r.totalValue.toFixed(2)}</td></tr>`).join('');
    document.getElementById('report-foot').innerHTML = data.length ? `
        <tr style="font-weight:700;background:var(--surface)">
            <td colspan="4" style="text-align:right;color:var(--muted)">Page Totals:</td>
            <td class="text-right">${d.totalQty.toFixed(0)}</td>
            <td></td>
            <td class="text-right">RM ${d.totalValue.toFixed(2)}</td>
        </tr>` : '';
    document.getElementById('rep-info').textContent = `Page ${d.page||1} of ${d.totalPages||1}`;
    document.getElementById('rep-prev').disabled = repPage <= 1;
    document.getElementById('rep-next').disabled = repPage >= (d.totalPages||1);
}

function goRepPage(p) { repPage = p; loadReport(); }

function exportReportCSV() {
    const rows = document.querySelectorAll('#report-body tr');
    let csv = 'SKU,Item,Type,Category,Qty,Cost,Total Value\n';
    rows.forEach(r => {
        const cells = r.querySelectorAll('td');
        csv += Array.from(cells).map(c=>'"'+c.textContent.trim().replace(/"/g,'""')+'"').join(',')+'\n';
    });
    const b = new Blob([csv],{type:'text/csv'}); const a = document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='report.csv'; a.click();
}

// Item History
async function searchPoItems() {
    const q = document.getElementById('ih-search').value.trim();
    if (!q) return;
    const res = await fetch('/api/reports/search-po-items?q='+encodeURIComponent(q));
    selectedPOItems = await res.json();
    const div = document.getElementById('ih-results');
    if (!selectedPOItems.length) { div.innerHTML='<p style="color:var(--muted)">No items found</p>'; return; }
    div.innerHTML = `<p style="margin-bottom:8px">Found ${selectedPOItems.length} items. Select items below and click "Run Item History Report":</p>
        <div style="max-height:200px;overflow-y:auto;margin-bottom:8px">` +
        selectedPOItems.map((it,i) => `<label style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px">
            <input type="checkbox" checked onchange="updateSelectedItems()" data-idx="${i}"> ${esc(it.stock_id)} — ${esc(it.item_name)}</label>`).join('') + '</div>';
    document.getElementById('ih-run-btn').style.display = 'inline-block';
}

async function runItemHistory() {
    const checked = [...document.querySelectorAll('#ih-results input:checked')].map(cb => selectedPOItems[cb.dataset.idx]);
    if (!checked.length) return toast('Select at least one item', false);
    const body = checked.map(it => ({id: it.stock_id, name: it.item_name}));
    const res = await fetch('/api/reports/item-history', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data = await res.json();
    document.getElementById('ih-body').innerHTML = data.map(r => `
        <tr><td style="font-family:monospace">${esc(r.stockId)}</td><td>${esc(r.itemName)}</td>
        <td>${esc(r.lastPoId)}</td><td>${esc(r.lastBuyDate)}</td>
        <td class="text-right">${r.lastBuyQty||'-'}</td><td class="text-right">${r.lastBuyCost||'-'}</td><td class="text-right">${r.lastBuyTotal||'-'}</td></tr>`).join('');
    document.getElementById('ih-report').scrollIntoView({behavior:'smooth'});
}

function toast(m,ok){const t=document.getElementById('toast');t.textContent=m;t.className='toast '+(ok?'toast-ok':'toast-err');t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
initReports();
</script>
{{end}}
