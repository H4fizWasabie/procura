{{template "base.html" .}}
{{define "content_rfq"}}
<div class="top-bar"><h2>RFQ</h2><button onclick="openCreate()">+ New RFQ</button></div>
<div class="search-bar">
    <input type="text" id="filter" placeholder="Search RFQ ID or supplier..." oninput="renderRFQ()" style="flex:1">
    <select id="f-supplier" style="width:180px" onchange="renderRFQ()"><option value="">All Suppliers</option></select>
</div>
<table><thead><tr><th>RFQ ID</th><th>Date</th><th>Supplier</th><th>Items</th><th>Actions</th></tr></thead><tbody id="body"></tbody></table>
<div id="toast" class="toast" style="display:none"></div>

<div id="create-modal" class="modal">
    <div class="modal-content" style="max-width:700px">
        <div class="modal-header"><h3 id="c-title">New RFQ</h3><span class="close" onclick="closeCreate()">&times;</span></div>
        <div class="modal-body">
            <div class="form-row">
                <div class="form-group"><label>RFQ ID</label><input id="c-id" disabled></div>
                <div class="form-group"><label>Date</label><input type="text" id="c-date" placeholder="DD/MM/YYYY"></div>
            </div>
            <div class="form-group rfq-supplier-picker"><label for="c-supplier">Supplier</label><input id="c-supplier" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="rfq-supplier-options" aria-expanded="false" placeholder="Search suppliers..." oninput="searchSuppliers()" onkeydown="supplierKeydown(event)"><div id="rfq-supplier-options" class="rfq-supplier-options" role="listbox" hidden></div><small id="rfq-supplier-status" aria-live="polite"></small></div>
            <div class="form-group"><label>Notes</label><textarea id="c-notes" rows="2" placeholder="Additional notes..."></textarea></div>
            <h4 style="margin:12px 0 8px">Items</h4>
            <table id="c-items"><thead><tr><th>Stock ID</th><th>Name</th><th>Qty</th><th>UOM</th><th></th></tr></thead><tbody></tbody></table>
            <button onclick="addItem()" style="margin-top:6px;font-size:11px">+ Add Item</button>
            <datalist id="rfq-item-list"></datalist>
            <div class="btn-group">
                <button class="btn-secondary" onclick="closeCreate()">Cancel</button>
                <button onclick="saveRFQ()">Save RFQ</button>
            </div>
        </div>
    </div>
</div>

<style>
.rfq-supplier-picker{position:relative}.rfq-supplier-picker input{width:100%}.rfq-supplier-options{position:absolute;top:100%;left:0;right:0;max-height:240px;overflow:auto;z-index:30;background:var(--surface-raised);border:1px solid var(--border);border-radius:7px;box-shadow:0 12px 24px rgba(0,0,0,.28)}.rfq-supplier-option{padding:8px 10px;cursor:pointer}.rfq-supplier-option[aria-selected="true"],.rfq-supplier-option:hover{background:var(--accent-soft);color:var(--text)}#rfq-supplier-status{display:block;color:var(--muted);margin-top:4px}
</style>
<script>
let suppliers = [], rfqData = [], invItems = [];
let selectedSupplier = '', supplierMatches = [], supplierActive = -1;
const supplierInput = () => document.getElementById('c-supplier');
function supplierScore(name, query) {
    const value = name.toLocaleLowerCase(), term = query.toLocaleLowerCase();
    const at = value.indexOf(term);
    if (at >= 0) return at / 100;
    let i = 0;
    for (const char of value) if (char === term[i]) i++;
    if (i === term.length) return 1 + value.length / 100;
    if (term.length < 3) return Infinity;
    let prev = Array.from({length: term.length + 1}, (_, n) => n);
    for (let row = 1; row <= value.length; row++) {
        const next = [row];
        for (let col = 1; col <= term.length; col++) next[col] = Math.min(next[col - 1] + 1, prev[col] + 1, prev[col - 1] + (value[row - 1] === term[col - 1] ? 0 : 1));
        prev = next;
    }
    return prev[term.length] <= 2 ? 2 + prev[term.length] + value.length / 100 : Infinity;
}
function setSupplier(name) {
    selectedSupplier = name;
    supplierInput().value = name;
    hideSupplierOptions();
    document.getElementById('rfq-supplier-status').textContent = '';
}
function hideSupplierOptions() {
    document.getElementById('rfq-supplier-options').hidden = true;
    supplierInput().setAttribute('aria-expanded', 'false');
    supplierInput().removeAttribute('aria-activedescendant');
    supplierActive = -1;
}
function searchSuppliers() {
    const query = supplierInput().value.trim();
    selectedSupplier = '';
    const list = document.getElementById('rfq-supplier-options');
    supplierMatches = query ? suppliers.map(s => s.supplier_name).map(name => ({name, score: supplierScore(name, query)})).filter(x => Number.isFinite(x.score)).sort((a,b) => a.score-b.score || a.name.localeCompare(b.name)).slice(0, 8).map(x => x.name) : [];
    supplierActive = -1;
    list.innerHTML = supplierMatches.map((name, i) => `<div id="rfq-supplier-option-${i}" class="rfq-supplier-option" role="option" aria-selected="false" onmousedown="event.preventDefault();setSupplier(suppliers.find(s=>s.supplier_name===this.textContent).supplier_name)">${esc(name)}</div>`).join('');
    list.hidden = !supplierMatches.length;
    supplierInput().setAttribute('aria-expanded', String(supplierMatches.length > 0));
    document.getElementById('rfq-supplier-status').textContent = query && !supplierMatches.length ? 'No matching suppliers' : '';
}
function supplierKeydown(event) {
    if (event.key === 'Escape') { hideSupplierOptions(); return; }
    if (!['ArrowDown','ArrowUp','Enter'].includes(event.key) || !supplierMatches.length) return;
    event.preventDefault();
    if (event.key === 'Enter') { if (supplierActive >= 0) setSupplier(supplierMatches[supplierActive]); return; }
    supplierActive = (supplierActive + (event.key === 'ArrowDown' ? 1 : -1) + supplierMatches.length) % supplierMatches.length;
    document.querySelectorAll('#rfq-supplier-options [role=option]').forEach((option, i) => {
        option.setAttribute('aria-selected', String(i === supplierActive));
        if (i === supplierActive) { option.scrollIntoView({block:'nearest'}); supplierInput().setAttribute('aria-activedescendant', option.id); }
    });
}
function toDMY(iso){if(!iso)return'';const s=iso.slice(0,10);if(s.indexOf('/')!==-1)return s;const d=s.split('-');if(d.length!==3)return s;return d[2]+'/'+d[1]+'/'+d[0]}
function fromDMY(dmy){if(!dmy)return'';const p=dmy.split('/');if(p.length!==3)return dmy;return p[2]+'-'+p[1]+'-'+p[0]}
function todayDMY(){const d=new Date();return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()}
async function init() {
    const sr = await fetch('/api/suppliers');
    suppliers = await sr.json();
    // Item suggestions from inventory (free text still allowed for new items)
    const ir = await fetch('/api/inventory/basic');
    invItems = await ir.json();
    document.getElementById('rfq-item-list').innerHTML = invItems.map(i =>
        `<option value="${esc(i['Item Name'])}"></option><option value="${esc(i['Stock ID'])}"></option>`).join('');
    load();

    // Check for draft from planning page
    const draft = sessionStorage.getItem('rfqDraft');
    if (draft) {
        sessionStorage.removeItem('rfqDraft');
        try {
            const d = JSON.parse(draft);
            openCreateWithDraft(d.supplier, d.items);
        } catch(e) {}
    }
}
async function load() {
    const res = await fetch('/api/rfq'); rfqData = await res.json() || [];
    const sup = document.getElementById('f-supplier').value;
    document.getElementById('f-supplier').innerHTML = '<option value="">All Suppliers</option>' +
        [...new Set(rfqData.map(r => r.supplier).filter(Boolean))].sort().map(s => `<option>${esc(s)}</option>`).join('');
    document.getElementById('f-supplier').value = sup; // keep selection across reloads
    renderRFQ();
}
function renderRFQ() {
    const q = (document.getElementById('filter').value || '').toLowerCase();
    const sup = document.getElementById('f-supplier').value;
    const rows = rfqData.filter(r => {
        if (sup && (r.supplier||'') !== sup) return false;
        if (q && !(r.rfq_id||'').toLowerCase().includes(q) && !(r.supplier||'').toLowerCase().includes(q)) return false;
        return true;
    });
    document.getElementById('body').innerHTML = rows.length ? rows.map(r => `
        <tr><td class="link">${esc(r.rfq_id)}</td><td>${toDMY(r.date)}</td>
        <td>${esc(r.supplier||'')}</td><td>${r.items_count||0}</td>
        <td style="display:flex;gap:4px">
            <button onclick="previewRFQ('${esc(r.rfq_id)}')" class="btn-sm">👁</button>
            <button onclick="downloadRFQ('${esc(r.rfq_id)}')" class="btn-sm">📥</button>
            <button onclick="editRFQ('${esc(r.rfq_id)}')" class="btn-sm">Edit</button>
            <button onclick="delRFQ('${esc(r.rfq_id)}')" class="btn-sm btn-danger">Del</button>
        </td></tr>`).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--muted)">No RFQs match filters</td></tr>';
}
async function openCreate() {
    const res = await fetch('/api/rfq/next-id'); const {id} = await res.json();
    document.getElementById('c-title').textContent = 'New RFQ';
    document.getElementById('c-id').value = id;
    document.getElementById('c-date').value = todayDMY();
    setSupplier('');
    document.getElementById('c-notes').value = '';
    document.getElementById('c-items').querySelector('tbody').innerHTML = '';
    addItem();
    document.getElementById('create-modal').classList.add('open');
}
function closeCreate() { document.getElementById('create-modal').classList.remove('open'); }
function editRFQ(id) {
    const r = rfqData.find(r => r.rfq_id === id);
    if (!r) return;
    document.getElementById('c-title').textContent = 'Edit RFQ';
    document.getElementById('c-id').value = r.rfq_id;
    document.getElementById('c-date').value = toDMY(r.date);
    setSupplier(r.supplier || '');
    document.getElementById('c-notes').value = '';
    const tbody = document.getElementById('c-items').querySelector('tbody');
    tbody.innerHTML = '';
    (r.items || []).forEach(it => addItem(it));
    if (!r.items || !r.items.length) addItem();
    document.getElementById('create-modal').classList.add('open');
}
async function openCreateWithDraft(supplier, items) {
    // fetch next ID but skip addItem() — we'll add draft items instead
    const res = await fetch('/api/rfq/next-id'); const {id} = await res.json();
    document.getElementById('c-title').textContent = 'New RFQ';
    document.getElementById('c-id').value = id;
    document.getElementById('c-date').value = todayDMY();
    document.getElementById('c-notes').value = '';
    setSupplier(supplier || '');
    const tbody = document.getElementById('c-items').querySelector('tbody');
    tbody.innerHTML = '';
    if (!items || !items.length) { addItem(); } else {
        items.forEach(it => addItem(it));
    }
    document.getElementById('create-modal').classList.add('open');
}
// On name change: exact match fills stock ID + UOM; no match keeps free text (new item).
function onRfqItemSelect(input) {
    const val = input.value.trim();
    if (!val) return;
    const match = invItems.find(i =>
        String(i['Item Name']).toLowerCase() === val.toLowerCase() ||
        String(i['Stock ID']).toLowerCase() === val.toLowerCase());
    if (!match) return;
    const row = input.closest('tr');
    row.querySelector('.ri-stock').value = match['Stock ID'];
    row.querySelector('.ri-uom').value = match['UOM'] || 'UNIT';
    input.value = match['Item Name'];
}
function addItem(it = {}) {
    const tbody = document.getElementById('c-items').querySelector('tbody');
    const row = document.createElement('tr');
    row.innerHTML = `<td><input style="width:100px" class="ri-stock" value="${esc(it.stock_id||'')}"></td>
        <td><input style="width:200px" class="ri-name" list="rfq-item-list" onchange="onRfqItemSelect(this)" placeholder="Search inventory..." value="${esc(it.item_name||'')}"></td>
        <td><input type="number" step="0.01" value="${it.qty || 1}" style="width:70px" class="ri-qty"></td>
        <td><input style="width:60px" class="ri-uom" value="${esc(it.uom||'UNIT')}"></td>
        <td><button onclick="this.closest('tr').remove()" class="btn-sm btn-danger">&times;</button></td>`;
    tbody.appendChild(row);
}
async function saveRFQ() {
    if (supplierInput().value.trim() && !selectedSupplier) {
        document.getElementById('rfq-supplier-status').textContent = 'Select a supplier from the suggestions.';
        supplierInput().focus();
        return;
    }
    const items = Array.from(document.querySelectorAll('#c-items tbody tr')).map(row => ({
        stock_id: row.querySelector('.ri-stock')?.value || '',
        item_name: row.querySelector('.ri-name')?.value || '',
        qty: parseFloat(row.querySelector('.ri-qty')?.value) || 0,
        uom: row.querySelector('.ri-uom')?.value || 'UNIT',
    }));
    const body = {
        rfq_id: document.getElementById('c-id').value,
        supplier: selectedSupplier,
        date: fromDMY(document.getElementById('c-date').value),
        notes: document.getElementById('c-notes').value,
        items: items,
    };
    const res = await fetch('/api/rfq', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const d = await res.json();
    toast(d.success?'Saved: '+d.rfq_id:d.error, d.success);
    if (d.success) { closeCreate(); load(); }
}
async function delRFQ(id) { if(!confirm('Delete '+id+'?'))return;
    await fetch('/api/rfq/'+encodeURIComponent(id),{method:'DELETE'}); toast('Deleted',true); load(); }
function toast(msg,ok){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(ok?'toast-ok':'toast-err');t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function previewRFQ(id){window.open('/rfq/'+encodeURIComponent(id)+'/preview','_blank')}
function downloadRFQ(id){window.location='/rfq/'+encodeURIComponent(id)+'/pdf'}
init();
</script>
{{end}}
