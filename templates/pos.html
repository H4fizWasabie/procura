{{template "base.html" .}}
{{define "content_pos"}}
<div class="top-bar" id="po-list-actions">
    <h2>Purchase Orders</h2>
    <div style="display:flex;gap:8px">
        <button class="btn-sm" onclick="window.location='/pos/unlinked'" title="PO lines without stock_id — link them to catalogue items">Unlinked Lines</button>
        <button onclick="switchTab('new')">+ New PO</button>
    </div>
</div>

<!-- Order History Tab -->
<div id="tab-history">
    <div class="search-bar">
        <input type="text" id="search" aria-label="Search purchase orders" placeholder="PO ID or supplier..." style="width:180px" oninput="loadPos()">
        <select id="f-supplier" aria-label="Filter by supplier" style="width:160px" onchange="loadPos()"><option value="">All Suppliers</option></select>
        <select id="f-status" aria-label="Filter by approval or payment status" style="width:130px" onchange="loadPos()">
            <option value="">All Status</option><option>Pending Approval</option><option>Approved</option>
            <option>Pending Payment</option><option>Paid</option><option>Partial</option><option>Void</option>
        </select>
        <select id="f-ship" aria-label="Filter by shipping status" style="width:120px" onchange="loadPos()">
            <option value="">All Ship</option><option>Pending</option><option>Shipped</option><option>Partial</option><option>Delivered</option><option>Received</option>
        </select>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)">
            <input type="checkbox" id="f-unpaid" onchange="loadPos()"> Unpaid only
        </label>
        <button onclick="loadPos()">Search</button>
        <button class="btn-secondary" onclick="resetPoFilters()">Reset</button>
        <button class="btn-secondary" onclick="exportPoCSV()">Export CSV</button>
        <button onclick="editSelectedPo()">Edit Selected</button>
    </div>

    <div class="po-column-options" aria-label="Optional columns">
        <span>Optional columns:</span>
        <label><input type="checkbox" id="show-invoice-number" onchange="renderPoList()"> Invoice number</label>
        <label><input type="checkbox" id="show-invoice-date" onchange="renderPoList()"> Invoice date</label>
        <span id="po-count" role="status"></span>
    </div>
    <div class="table-scroll po-list-table" id="po-list-scroll">
        <table>
            <thead id="po-head"></thead>
            <tbody id="po-body"></tbody>
        </table>
    </div>

</div>

    <!-- Dedicated PO detail view -->
    <div id="po-detail" style="display:none">
        <div class="po-view-header"><button class="btn-secondary" onclick="closePoDetail()">Back to orders</button><button onclick="editSelectedPo()">Edit order</button></div>
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                <h3 id="po-detail-title">PO Details</h3>
                <div style="display:flex;gap:6px;align-items:center">
                    <button onclick="previewPO()" style="font-size:11px;padding:3px 8px">Preview</button>
                    <button onclick="downloadPO()" style="font-size:11px;padding:3px 8px">Download PDF</button>

                </div>
            </div>
            <dl class="po-detail-summary" id="po-detail-grid"></dl>
            <!-- Status / Ship / Invoice row -->
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
                <select id="po-edit-status" aria-label="Approval or payment status" style="width:150px" onchange="updatePoField('status')">
                    <option value="">Status</option><option>Pending Approval</option><option>Approved</option>
                    <option>Pending Payment</option><option>Paid</option><option>Partial</option><option>Void</option>
                </select>
                <select id="po-edit-ship" aria-label="Shipping status" style="width:130px" onchange="updatePoField('ship')">
                    <option value="">Ship Status</option><option>Pending</option><option>Shipped</option><option>Partial</option><option>Delivered</option><option>Received</option>
                </select>
                <input type="text" id="po-edit-invdate" aria-label="Invoice date, day/month/year" style="width:130px" placeholder="DD/MM/YYYY">
                <button class="btn-secondary btn-sm" onclick="updatePoField('invdate')">Set Inv Date</button>
            </div>
            <h4 style="margin-bottom:8px">Items</h4>
            <table><thead><tr><th>Stock ID</th><th>Item</th><th class="text-right">Qty</th><th class="text-right">Cost</th><th class="text-right">Total</th><th>Hospital UOM</th><th>Supplier UOM</th></tr></thead>
                <tbody id="po-detail-items"></tbody></table>
        </div>
    </div>

<!-- Dedicated PO form -->
<div id="tab-new" style="display:none">
    <div class="po-view-header"><button class="btn-secondary" onclick="switchTab('history')">Back to orders</button><h2 id="po-form-title">New purchase order</h2><span class="muted" id="po-edit-state" role="status"></span></div>
    <div class="card">
        <h3>PO Header</h3>
        <div class="po-edit-fields">
            <div class="form-group"><label>PO ID</label><input id="npo-id" style="font-family:monospace;font-weight:700;color:var(--accent)" placeholder="Auto-generated" onchange="checkPoId()"></div>
            <div class="form-group"><label>Date</label><input type="text" id="npo-date" placeholder="DD/MM/YYYY" required></div>
            <div class="form-group"><label>Department</label><select id="npo-dept" required><option value="">-- Select --</option>
                <option>Pharmacy</option><option>Surgical</option><option>Diagnostic</option><option>Lab</option><option>Medical/Ward</option></select></div>
            <div class="form-group"><label>Supplier</label><input id="npo-supplier" list="po-sup-list" placeholder="Search supplier..." required><datalist id="po-sup-list"></datalist></div>
            <div class="form-group"><label>Bill #</label><input id="npo-bill" placeholder="Optional invoice ref"></div>
            <div class="form-group"><label>Invoice Date</label><input type="text" id="npo-inv-date" placeholder="DD/MM/YYYY"></div>
            <div class="form-group"><label>Terms</label><input id="npo-terms" readonly placeholder="Auto from supplier"></div>
            <div class="form-group"><label>Shipping Status</label><select id="npo-ship">
                <option>Pending</option><option>Shipped</option><option>Partial</option><option>Delivered</option><option>Received</option>
            </select></div>
        </div>

        <!-- Add Item Row -->
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
            <span style="font-size:13px;font-weight:600">Item:</span>
            <div id="npo-item-picker" class="po-item-picker">
                <input id="npo-item-search" autocomplete="off" aria-autocomplete="list" aria-controls="po-item-suggestions" aria-expanded="false" placeholder="Type item name or [STOCK_ID] name...">
                <div id="po-item-suggestions" class="po-item-suggestions" role="listbox" hidden></div>
            </div>
            <span style="font-size:12px">Sup.UOM:</span><input id="npo-sup-uom" style="width:80px" placeholder="Box/Pack">
            <span style="font-size:12px">Qty:</span><input id="npo-qty" type="number" step="0.01" style="width:70px">
            <span style="font-size:12px">Line Total:</span><input id="npo-line-total" type="number" step="0.01" style="width:110px">
            <button onclick="addPoItem()">+ Add Item</button>
        </div>

        <table>
            <thead><tr><th>Stock ID</th><th>Item Name</th><th>UOM</th><th>Sup.UOM</th><th class="text-right">Qty</th><th class="text-right">Cost</th><th class="text-right">Total</th><th></th></tr></thead>
            <tbody id="npo-items"></tbody>
        </table>
        <div id="npo-empty" style="padding:20px;text-align:center;color:var(--muted)">No items added yet</div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
            <div class="stat" id="npo-total" style="color:var(--accent)">RM 0.00</div>
            <div style="display:flex;gap:8px">
                <button class="btn-secondary" onclick="resetPoForm()">Reset</button>
                <button id="po-save" onclick="savePo()">Save Order</button>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<style>
.sub-tab{padding:10px 20px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px}
.sub-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.text-right{text-align:right}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:4px}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.btn-secondary:hover{background:var(--border)}
.po-list-table{max-height:62vh}
.po-list-table th{position:sticky;top:0;z-index:1}
.po-list-table tbody tr[data-open-po]{cursor:pointer}
.po-list-table tbody tr[data-open-po]:hover{background:var(--surface-raised)}
.po-list-actions{white-space:nowrap}
.po-item-picker{position:relative;flex:1;min-width:200px}
.po-item-picker>input{width:100%}
.po-item-suggestions{position:absolute;top:calc(100% + 4px);left:0;width:min(760px,calc(100vw - 48px));max-height:320px;overflow-y:auto;z-index:30;background:var(--surface-raised);border:1px solid var(--border);border-radius:7px;box-shadow:0 12px 24px rgba(0,0,0,.28)}
.po-item-option{display:grid;grid-template-columns:minmax(140px,220px) minmax(0,1fr);gap:12px;width:100%;padding:10px 12px;background:transparent;border:0;border-radius:0;box-shadow:none;color:var(--text);text-align:left;font-weight:400;cursor:pointer}
.po-item-option:hover,.po-item-option.active{background:var(--accent-soft)}
.po-item-option-id{color:var(--accent);font-family:monospace;font-size:12px;overflow-wrap:anywhere}
.po-item-option-name{min-width:0;white-space:normal;overflow-wrap:anywhere}
.po-item-empty{padding:12px;color:var(--muted);font-size:12px}
@media (max-width:720px){.po-item-suggestions{width:calc(100vw - 32px)}.po-item-option{grid-template-columns:1fr;gap:3px}}
</style>

<script>
let allPos=[], poItems=[], poItemMaster=[], poItemLookup={}, poSupplierUOMLookup={}, selectedPoId='', poSuggestionItems=[], poSuggestionIndex=-1;
let poView='history', selectedPo=null, poFormBaseline='', poListScroll=0, poRequest=0;

function sizePoList() {
    if (poView !== 'history') return;
    const list = document.getElementById('po-list-scroll');
    const bottomSpace = parseFloat(getComputedStyle(document.querySelector('main')).paddingBottom);
    list.style.maxHeight = Math.max(160, innerHeight - list.getBoundingClientRect().top - scrollY - bottomSpace) + 'px';
}


// DD/MM/YYYY helpers
function toDMY(iso){if(!iso)return'';const s=iso.slice(0,10);if(s.indexOf('/')!==-1)return s;const d=s.split('-');if(d.length!==3)return s;return d[2]+'/'+d[1]+'/'+d[0]}
function fromDMY(dmy){if(!dmy)return'';const p=dmy.split('/');if(p.length!==3)return dmy;return p[2]+'-'+p[1]+'-'+p[0]}
function todayDMY(){const d=new Date();return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()}

async function initPo() {
    window.addEventListener('resize', sizePoList);
    const poLayoutObserver = new ResizeObserver(sizePoList);
    ['#po-list-actions', '#tab-history .search-bar', '.po-column-options'].forEach(selector => poLayoutObserver.observe(document.querySelector(selector)));

    document.getElementById('npo-date').value = todayDMY();
    const [itemRes,supRes,uomRes] = await Promise.all([
        fetch('/api/inventory?page=1&pageSize=5000'),
        fetch('/api/suppliers'),
        fetch('/api/uom/mappings'),
    ]);
    poItemMaster = await itemRes.json();
    poItemLookup = {};
    poItemMaster.forEach(i => {
        const d = `[${i.stock_id}] ${i.item_name}`;
        poItemLookup[d.toLowerCase()] = i;
        if (i.stock_id) poItemLookup[(i.stock_id||'').toLowerCase()] = i;
        if (i.item_name) poItemLookup[(i.item_name||'').toLowerCase()] = i;
    });
    const mappings = await uomRes.json();
    poSupplierUOMLookup = {};
    (mappings||[]).forEach(m => {
        if (m.supplier_name && m.stock_id && m.supplier_uom) {
            poSupplierUOMLookup[(m.supplier_name+'|'+m.stock_id).toLowerCase()] = m.supplier_uom;
        }
    });
    const suppliers = await supRes.json();
    document.getElementById('po-sup-list').innerHTML = suppliers.map(s => `<option>${esc(s.supplier_name)}</option>`).join('');
    document.getElementById('f-supplier').innerHTML = '<option value="">All Suppliers</option>' +
        suppliers.map(s => `<option>${esc(s.supplier_name)}</option>`).join('');
    // Listen for supplier changes to auto-fill terms
    document.getElementById('npo-supplier').addEventListener('change', async function() {
        const name = this.value.trim(); if(!name) return;
        const match = suppliers.find(s => s.supplier_name.toLowerCase() === name.toLowerCase());
        if (match) document.getElementById('npo-terms').value = match.payment_terms || '';
        fillSupplierUOM();
    });
    const itemInput = document.getElementById('npo-item-search');
    itemInput.addEventListener('change', fillSupplierUOM);
    itemInput.addEventListener('focus', renderPoSuggestions);
    itemInput.addEventListener('input', function() {
        poSuggestionIndex = -1;
        renderPoSuggestions();
        const v = this.value.trim();
        if (v.includes(']') || v.length > 20) fillSupplierUOM();
    });
    itemInput.addEventListener('keydown', handlePoItemKeydown);
    document.addEventListener('click', function(event) {
        if (!document.getElementById('npo-item-picker').contains(event.target)) hidePoSuggestions();
    });
    restorePoList();
    await loadPos();
    poFormBaseline = poFormSnapshot();
    const requestedId = new URLSearchParams(location.search).get('order');
    if (requestedId) await selectPo(requestedId, false);
    window.addEventListener('popstate', async () => {
        if (!canLeavePoForm()) {
            history.pushState({}, '', '/pos?edit=1');
            return;
        }
        const id = new URLSearchParams(location.search).get('order');
        if (id) await selectPo(id, false); else showPoView('history');
    });
    window.addEventListener('beforeunload', event => {
        if (poView === 'new' && poFormChanged()) { event.preventDefault(); event.returnValue = ''; }
    });
    document.addEventListener('click', event => {
        if (event.target.closest('a[href]') && poView === 'new' && !canLeavePoForm()) event.preventDefault();
    });
    document.getElementById('tab-new').addEventListener('input', updatePoEditState);
    document.getElementById('tab-new').addEventListener('change', updatePoEditState);
}

function renderPoSuggestions() {
    const input = document.getElementById('npo-item-search');
    const list = document.getElementById('po-item-suggestions');
    const query = input.value.trim().toLowerCase();
    // ponytail: show first 50 matches; add server-side search if inventory outgrows client filtering.
    poSuggestionItems = query ? poItemMaster.filter(i =>
        String(i.stock_id||'').toLowerCase().includes(query) ||
        String(i.item_name||'').toLowerCase().includes(query)
    ).slice(0, 50) : [];
    if (!query) return hidePoSuggestions();
    if (!poSuggestionItems.length) {
        list.innerHTML = '<div class="po-item-empty">No matching items</div>';
        list.hidden = false;
        input.setAttribute('aria-expanded', 'true');
        return;
    }
    list.innerHTML = poSuggestionItems.map((item, index) =>
        `<button type="button" class="po-item-option" role="option" data-index="${index}">
            <span class="po-item-option-id">${esc(item.stock_id)}</span>
            <span class="po-item-option-name">${esc(item.item_name)}</span>
        </button>`).join('');
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    list.querySelectorAll('.po-item-option').forEach(option => option.addEventListener('mousedown', event => {
        event.preventDefault();
        selectPoItem(Number(option.dataset.index));
    }));
}

function selectPoItem(index) {
    const item = poSuggestionItems[index];
    if (!item) return;
    document.getElementById('npo-item-search').value = `[${item.stock_id}] ${item.item_name}`;
    fillSupplierUOM();
    hidePoSuggestions();
    document.getElementById('npo-item-search').focus();
}

function updatePoSuggestionFocus() {
    const options = document.querySelectorAll('#po-item-suggestions .po-item-option');
    options.forEach((option, index) => option.classList.toggle('active', index === poSuggestionIndex));
    if (options[poSuggestionIndex]) options[poSuggestionIndex].scrollIntoView({block:'nearest'});
}

function handlePoItemKeydown(event) {
    const list = document.getElementById('po-item-suggestions');
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        if (list.hidden) renderPoSuggestions();
        if (!poSuggestionItems.length) return;
        event.preventDefault();
        poSuggestionIndex = event.key === 'ArrowDown'
            ? Math.min(poSuggestionIndex + 1, poSuggestionItems.length - 1)
            : Math.max(poSuggestionIndex - 1, 0);
        updatePoSuggestionFocus();
    } else if (event.key === 'Enter' && !list.hidden && poSuggestionIndex >= 0) {
        event.preventDefault();
        selectPoItem(poSuggestionIndex);
    } else if (event.key === 'Escape') {
        hidePoSuggestions();
    }
}

function hidePoSuggestions() {
    const list = document.getElementById('po-item-suggestions');
    if (!list) return;
    list.hidden = true;
    list.innerHTML = '';
    poSuggestionIndex = -1;
    document.getElementById('npo-item-search')?.setAttribute('aria-expanded', 'false');
}

function lookupSupplierUOM(item) {
    const supplier = document.getElementById('npo-supplier').value.trim();
    if (!supplier || !item || !item.stock_id) return '';
    return poSupplierUOMLookup[(supplier+'|'+item.stock_id).toLowerCase()] || '';
}

function fillSupplierUOM() {
    const item = poItemLookup[document.getElementById('npo-item-search').value.trim().toLowerCase()];
    const mapped = lookupSupplierUOM(item);
    if (mapped) {
        document.getElementById('npo-sup-uom').value = mapped;
    } else if (item && item.uom) {
        document.getElementById('npo-sup-uom').value = item.uom;
    }
}

function poFormSnapshot() {
    return JSON.stringify({fields: Array.from(document.querySelectorAll('#tab-new input, #tab-new select')).map(e => [e.id,e.value]), items:poItems});
}
function poFormChanged() { return poFormSnapshot() !== poFormBaseline; }
function canLeavePoForm() {
    if (poView !== 'new' || !poFormChanged()) return true;
    if (!confirm('Discard your unsaved purchase order changes?')) return false;
    poFormBaseline = poFormSnapshot();
    return true;
}
function updatePoEditState() { document.getElementById('po-edit-state').textContent = poFormChanged() ? 'Unsaved changes' : ''; }
function showPoView(name) {
    poView = name;
    for (const [id, view] of [['tab-history','history'],['tab-new','new'],['po-detail','detail']]) document.getElementById(id).style.display = name === view ? 'block' : 'none';
    document.getElementById('po-list-actions').style.display = name === 'history' ? 'flex' : 'none';
    if (name === 'history') {
        document.getElementById('po-list-scroll').scrollTop = poListScroll;
        renderPoList();
        sizePoList();
    }
    window.scrollTo({top:0});
}
function switchTab(name) {
    if (!canLeavePoForm()) return;
    if (name === 'new') {
        resetPoForm(false);
        document.getElementById('po-form-title').textContent = 'New purchase order';
    }
    showPoView(name);
    history.replaceState({}, '', '/pos');
}
function storePoList() {
    sessionStorage.setItem('procura-po-list', JSON.stringify({fields:Object.fromEntries(['search','f-supplier','f-status','f-ship'].map(id => [id,document.getElementById(id).value])), unpaid:document.getElementById('f-unpaid').checked, invoiceNumber:document.getElementById('show-invoice-number').checked, invoiceDate:document.getElementById('show-invoice-date').checked, selected:selectedPoId, scroll:poListScroll}));
}
function restorePoList() {
    try {
        const saved = JSON.parse(sessionStorage.getItem('procura-po-list') || 'null');
        if (!saved) return;
        for (const [id,value] of Object.entries(saved.fields || {})) document.getElementById(id).value = value;
        document.getElementById('f-unpaid').checked = !!saved.unpaid;
        document.getElementById('show-invoice-number').checked = !!saved.invoiceNumber;
        document.getElementById('show-invoice-date').checked = !!saved.invoiceDate;
        selectedPoId = saved.selected || ''; poListScroll = saved.scroll || 0;
    } catch {} // Invalid or expired saved UI state falls back to the default list.
}
async function loadPos() {
    const request = ++poRequest;
    const params = new URLSearchParams();
    const add = (k,v) => {if(v) params.set(k,v)};
    add('search', document.getElementById('search').value);
    add('supplier', document.getElementById('f-supplier').value);
    add('status', document.getElementById('f-status').value);
    add('ship_status', document.getElementById('f-ship').value);
    if (document.getElementById('f-unpaid').checked) params.set('unpaid','1');
    storePoList();
    try {
        const res = await fetch('/api/pos?'+params);
        const orders = await res.json();
        if (request !== poRequest) return;
        if (!res.ok || !Array.isArray(orders)) throw new Error(orders?.error || 'Could not load orders');
        allPos = orders;
        renderPoList();
    } catch (err) { if (request === poRequest) toast(err.message, false); }
}
function renderPoList() {
    const invoiceNumber = document.getElementById('show-invoice-number').checked;
    const invoiceDate = document.getElementById('show-invoice-date').checked;
    document.getElementById('po-head').innerHTML = '<tr><th>PO ID</th><th>Supplier</th><th>Order date</th><th class="text-right">Total</th><th class="text-right">Paid</th><th class="text-right">Outstanding</th><th>Approval / payment</th><th>Shipping</th>'+(invoiceNumber?'<th>Invoice number</th>':'')+(invoiceDate?'<th>Invoice date</th>':'')+'<th>Actions</th></tr>';
    document.getElementById('po-body').innerHTML = (allPos||[]).map(p => `<tr class="${selectedPoId === p.po_id ? 'selected' : ''}" data-open-po="${esc(p.po_id)}" tabindex="0" aria-label="Open purchase order ${esc(p.po_id)}">
        <td><button data-po-id="${esc(p.po_id)}">${esc(p.po_id)}</button></td>
        <td>${esc(p.supplier)||'-'}</td><td>${toDMY(p.date)||'-'}</td>
        <td class="text-right money">RM ${(p.total||0).toFixed(2)}</td>
        <td class="text-right money">RM ${(p.paid||0).toFixed(2)}</td>
        <td class="text-right money">RM ${(p.balance||0).toFixed(2)}</td>
        <td><span class="badge ${(p.status||'').toLowerCase().includes('paid')?'badge-green':(p.status||'').toLowerCase().includes('pending')?'badge-amber':'badge-blue'}">${esc(p.status)||'-'}</span></td>
        <td>${esc(p.ship_status)||'-'}</td>${invoiceNumber?`<td>${esc(p.bill_no)||'-'}</td>`:''}${invoiceDate?`<td>${toDMY(p.invoice_date)||'-'}</td>`:''}
        <td class="po-list-actions"><button type="button" class="btn-secondary btn-sm" data-po-preview="${esc(p.po_id)}">Preview</button> <button type="button" class="btn-secondary btn-sm" data-po-pdf="${esc(p.po_id)}">Print / PDF</button></td>
    </tr>`).join('') || `<tr><td colspan="${9+Number(invoiceNumber)+Number(invoiceDate)}" class="empty">No orders match these filters. Reset filters to see all orders.</td></tr>`;
    document.querySelectorAll('#po-body [data-open-po]').forEach(row => {
        row.addEventListener('click', () => selectPo(row.dataset.openPo));
        row.addEventListener('keydown', event => {
            if (event.target !== row || (event.key !== 'Enter' && event.key !== ' ')) return;
            event.preventDefault();
            selectPo(row.dataset.openPo);
        });
    });
    document.querySelectorAll('#po-body [data-po-preview]').forEach(button => button.addEventListener('click', event => {
        event.stopPropagation();
        previewPO(button.dataset.poPreview);
    }));
    document.querySelectorAll('#po-body [data-po-pdf]').forEach(button => button.addEventListener('click', event => {
        event.stopPropagation();
        downloadPO(button.dataset.poPdf);
    }));
    document.getElementById('po-count').textContent = `${allPos.length} orders`;
    storePoList();
}

function resetPoFilters() {
    ['search','f-supplier','f-status','f-ship'].forEach(id => document.getElementById(id).value='');
    document.getElementById('f-unpaid').checked = false;
    loadPos();
}

async function selectPo(poId, push = true) {
    if (!canLeavePoForm()) return;
    if (poView === 'history') poListScroll = document.getElementById('po-list-scroll').scrollTop;
    let po = allPos.find(p => p.po_id === poId);
    if (!po) {
        try {
            const res = await fetch('/api/pos?search='+encodeURIComponent(poId));
            if (!res.ok) throw new Error();
            po = (await res.json()).find(p => p.po_id === poId);
        } catch { return toast('Could not load this order. Please retry.', false); }
    }
    if (!po) return toast('This order could not be found.',false);
    selectedPoId = poId; selectedPo = po; storePoList();
    showPoView('detail');
    if (push) history.pushState({}, '', '/pos?order='+encodeURIComponent(poId));
    renderPoDetail(po);
}
function renderPoDetail(po) {
    document.getElementById('po-detail-title').textContent = po.po_id;
    const details = [['Order date',toDMY(po.date)||'-'],['Supplier',po.supplier||'-'],['Total','RM '+(po.total||0).toFixed(2)],['Paid','RM '+(po.paid||0).toFixed(2)],['Outstanding balance','RM '+(po.balance||0).toFixed(2)],['Effective balance','RM '+((po.total||0)-(po.paid||0)-(po.balance||0)).toFixed(2)],['Invoice number',po.bill_no||'-'],['Invoice date',toDMY(po.invoice_date)||'-'],['Terms',po.terms||'-'],['Department',po.department||'-'],['Approval / payment',po.status||'-'],['Shipping',po.ship_status||'-']];
    document.getElementById('po-detail-grid').innerHTML = details.map(([label,value]) => `<div><dt>${label}</dt><dd>${esc(value)}</dd></div>`).join('');
    setPoSelect('po-edit-status', po.status||'');
    setPoSelect('po-edit-ship', po.ship_status||'');
    document.getElementById('po-edit-invdate').value = toDMY(po.invoice_date);
    document.getElementById('po-detail-items').innerHTML = (po.items||[]).map(it => `
        <tr><td>${esc(it.stock_id)||'-'}</td><td>${esc(it.item_name)||''}</td>
        <td class="text-right">${(it.quantity||0).toFixed(2)}</td>
        <td class="text-right">RM ${(it.cost||0).toFixed(2)}</td>
        <td class="text-right">RM ${(it.total||0).toFixed(2)}</td><td>${esc(it.uom)||'UNIT'}</td>
        <td>${esc(it.supplier_uom)||'-'}</td></tr>`).join('');
}
function setPoSelect(id, value) {
    const select = document.getElementById(id);
    if (value && !Array.from(select.options).some(option => option.value === value)) select.add(new Option(value, value));
    select.value = value;
}
function closePoDetail() {
    showPoView('history');
    history.replaceState({}, '', '/pos');
}

async function updatePoField(field) {
    if (!selectedPoId) return;
    let body, endpoint;
    if (field === 'invdate') {
        body = {invoice_date: fromDMY(document.getElementById('po-edit-invdate').value)};
        endpoint = 'invoice-date';
    } else {
        body = {field: field === 'ship' ? 'ship' : 'status', status: document.getElementById(field === 'ship' ? 'po-edit-ship' : 'po-edit-status').value};
        endpoint = 'status';
    }
    try {
        const res = await fetch('/api/pos/'+encodeURIComponent(selectedPoId)+'/'+endpoint, {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
        const d = await res.json();
        if (!res.ok || !d.success) return toast('Error: '+(d.error||'Could not update order'), false);
        toast('Updated', true);
        await loadPos();
        const resRead = await fetch('/api/pos?search='+encodeURIComponent(selectedPoId));
        if (!resRead.ok) throw new Error();
        selectedPo = (await resRead.json()).find(p => p.po_id === selectedPoId);
        if (selectedPo) renderPoDetail(selectedPo);
    } catch (err) {
        toast('Could not confirm the update. Reload the order before retrying.', false);
    }
}

function editSelectedPo() {
    if (!selectedPoId) return toast('Select a PO first', false);
    if (!canLeavePoForm()) return;
    const po = selectedPo || allPos.find(p => p.po_id === selectedPoId);
    if (!po) return;
    showPoView('new');
    document.getElementById('po-form-title').textContent = 'Edit '+po.po_id;
    document.getElementById('npo-id').value = po.po_id;
    document.getElementById('npo-date').value = toDMY(po.date);
    document.getElementById('npo-supplier').value = po.supplier||'';
    document.getElementById('npo-bill').value = po.bill_no||'';
    document.getElementById('npo-inv-date').value = toDMY(po.invoice_date);
    setPoSelect('npo-dept', po.department||'');
    document.getElementById('npo-terms').value = po.terms||'';
    setPoSelect('npo-ship', po.ship_status||'Pending');
    poItems = (po.items||[]).map(it => ({
        stock_id: it.stock_id, item_name: it.item_name, uom: it.uom||'UNIT',
        supplier_uom: it.supplier_uom||'', quantity: it.quantity, cost: it.cost, total: it.total,
    }));
    renderPoItems();
    poFormBaseline = poFormSnapshot();
    updatePoEditState();
}

async function checkPoId() {
    const id = document.getElementById('npo-id').value.trim();
    if (!id||id.length<5) return;
    const po = allPos.find(p => p.po_id === id);
    if (po) {
        selectedPoId = id; selectedPo = po;
        editSelectedPo();
    }
}

function addPoItem() {
    const text = document.getElementById('npo-item-search').value.trim();
    if(!text) return;
    const qty = parseFloat(document.getElementById('npo-qty').value)||0;
    const lineTotal = parseFloat(document.getElementById('npo-line-total').value)||0;
    if (qty<=0) return toast('Quantity must be > 0',false);
    let matched = poItemLookup[text.toLowerCase()];
    let stockId='', name=text, uom='UNIT', cost=0;
    if (matched) { stockId=matched.stock_id; name=matched.item_name; uom=matched.uom||'UNIT'; cost=matched.cost||0; }
    else {
        const m = text.match(/^\[([^\]]+)\]\s+(.+)/);
        if (m) { stockId=m[1]; name=m[2]; }
    }
    const supUom = document.getElementById('npo-sup-uom').value.trim() || lookupSupplierUOM(matched);
    const unitCost = qty>0 ? lineTotal/qty : cost;
    poItems.push({stock_id:stockId, item_name:name, uom:uom, supplier_uom:supUom, quantity:qty, cost:unitCost, total:lineTotal});
    renderPoItems();
    ['npo-item-search','npo-qty','npo-line-total','npo-sup-uom'].forEach(id => document.getElementById(id).value='');
}

function removePoItem(i) { poItems.splice(i,1); renderPoItems(); }

function renderPoItems() {
    updatePoEditState();
    const tbody = document.getElementById('npo-items');
    if (!poItems.length) { tbody.innerHTML=''; document.getElementById('npo-empty').style.display='block';
        document.getElementById('npo-total').textContent='RM 0.00'; return; }
    document.getElementById('npo-empty').style.display='none';
    const total = poItems.reduce((s,i)=>s+(i.total||0),0);
    document.getElementById('npo-total').textContent = 'RM '+total.toFixed(2);
    tbody.innerHTML = poItems.map((it,i)=>`
        <tr><td>${esc(it.stock_id)}</td><td>${esc(it.item_name)}</td><td>${esc(it.uom)}</td><td>${esc(it.supplier_uom||'')}</td>
        <td class="text-right">${(it.quantity||0).toFixed(2)}</td>
        <td class="text-right">RM ${(it.cost||0).toFixed(2)}</td>
        <td class="text-right">RM ${(it.total||0).toFixed(2)}</td>
        <td><button class="btn-secondary btn-sm" onclick="removePoItem(${i})" style="color:var(--red)">x</button></td></tr>`).join('');
}

function resetPoForm(ask = true) {
    if (ask && !canLeavePoForm()) return;
    document.getElementById('npo-id').value='';
    document.getElementById('npo-date').value=todayDMY();
    document.getElementById('npo-supplier').value='';
    document.getElementById('npo-dept').value='';
    document.getElementById('npo-bill').value='';
    document.getElementById('npo-inv-date').value='';
    document.getElementById('npo-terms').value='';
    document.getElementById('npo-ship').value='Pending';
    poItems=[]; renderPoItems();
    poFormBaseline = poFormSnapshot(); updatePoEditState();
}

async function savePo() {
    const required = [['npo-date','Date'],['npo-dept','Department'],['npo-supplier','Supplier']];
    const missing = required.filter(([id]) => !document.getElementById(id).value.trim());
    if (missing.length) {
        toast('Required: '+missing.map(([,label]) => label).join(', '), false);
        document.getElementById(missing[0][0]).focus();
        return;
    }
    const supplier = document.getElementById('npo-supplier').value.trim();
    if(!poItems.length) return toast('Add at least one item',false);
    const body = { po_id: document.getElementById('npo-id').value,
        date: fromDMY(document.getElementById('npo-date').value), supplier: supplier,
        department: document.getElementById('npo-dept').value,
        bill_no: document.getElementById('npo-bill').value,
        invoice_date: fromDMY(document.getElementById('npo-inv-date').value),
        terms: document.getElementById('npo-terms').value,
        ship_status: document.getElementById('npo-ship').value,
        items: poItems.map(it => ({stock_id:it.stock_id,item_name:it.item_name,name:it.item_name,
            quantity:it.quantity,qty:it.quantity,cost:it.cost,total:it.total,uom:it.uom,supplier_uom:it.supplier_uom})),
    };
    const button = document.getElementById('po-save');
    if (button.disabled) return;
    button.disabled = true;
    try {
    const res = await fetch('/api/pos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d = await res.json();
    if(res.ok && d.success){ toast('PO '+d.po_id+' saved!',true); document.getElementById('npo-id').value=d.po_id; poFormBaseline = poFormSnapshot(); updatePoEditState(); await loadPos(); selectedPoId=d.po_id; selectedPo=allPos.find(p => p.po_id === d.po_id)||null; }
    else toast('Error: '+d.error,false);
    } catch { toast('Could not confirm the save. Reload the order before retrying.',false); }
    finally { button.disabled = false; }
}

function exportPoCSV() {
    const headers=['PO ID','Invoice number','Order date','Supplier','Total','Paid','Outstanding balance','Effective balance','Approval / payment','Shipping','Terms','Department','Invoice date'];
    const quote = value => '"'+String(value??'').replaceAll('"','""')+'"';
    const rows=allPos.map(p => [p.po_id,p.bill_no,toDMY(p.date),p.supplier,p.total||0,p.paid||0,p.balance||0,(p.total||0)-(p.paid||0)-(p.balance||0),p.status,p.ship_status,p.terms,p.department,toDMY(p.invoice_date)]);
    const csv=[headers,...rows].map(row => row.map(quote).join(',')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const a=document.createElement('a'); a.href=url; a.download='pos.csv'; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function toast(m,ok){const t=document.getElementById('toast');t.textContent=m;t.className='toast '+(ok?'toast-ok':'toast-err');t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function esc(s){if(s==null)return'';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML.replaceAll('\"','&quot;').replaceAll("'",'&#39;')}
function previewPO(poId=selectedPoId){if(!poId)return;window.open('/pos/'+encodeURIComponent(poId)+'/preview','_blank')}
function downloadPO(poId=selectedPoId){if(!poId)return;window.location='/pos/'+encodeURIComponent(poId)+'/pdf'}
initPo();
</script>
