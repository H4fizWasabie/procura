<div id="view-po" class="view-section hidden">
  <div class="module-header">
    <h2><span class="material-icons">shopping_bag</span> Purchase Orders</h2>
    <div class="sub-tabs">
      <button class="sub-tab-btn active" onclick="switchPoTab('form')">New / Edit PO</button>
      <button class="sub-tab-btn" onclick="switchPoTab('history')">Order History</button>
    </div>
  </div>

  <div id="po-tab-form" class="sub-tab-content">
    <div class="card">
      <div class="action-bar"
        style="background:var(--bg-app); border-bottom:1px solid var(--border); padding:15px 20px; display:flex; gap:10px; justify-content:flex-end; align-items:center; position:sticky; top:0; z-index:10; border-radius: 10px 10px 0 0;">
        <div style="flex:1; font-weight:700; color:var(--text-main); font-size:1.1rem;">
          Total: <span id="po-total-display" style="color:var(--primary);">0.00</span>
        </div>
        <button type="button" class="btn btn-secondary" onclick="addPoRow()"><span
            class="material-icons">add_circle</span> Add Item</button>
        <button type="button" class="btn btn-secondary" onclick="resetPoForm()"><span
            class="material-icons">refresh</span> Reset</button>
        <button type="button" class="btn btn-warning" onclick="previewPdfFromForm()"><span
            class="material-icons">picture_as_pdf</span> PDF</button>
        <button type="button" class="btn btn-primary" onclick="triggerPoSubmit()"><span
            class="material-icons">save</span> Save Order</button>
      </div>

      <form id="po-form" onsubmit="handlePoSubmit(event)" style="padding:25px;">
        <div class="po-header-grid">
          <div class="form-group">
            <label>PO ID (Search/Edit)</label>
            <input type="text" id="po-id" name="po_id" class="tbl-input" onchange="checkPoId()"
              style="font-family:'Segoe UI', monospace; font-weight:700; color:var(--primary); background:var(--bg-app); border-color:var(--primary);"
              placeholder="Auto or Type ID...">
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="po-date" name="date" class="tbl-input" required>
          </div>
          <div class="form-group">
            <label>Department *</label>
            <select id="po-dept" name="dept" class="tbl-input" required>
              <option value="">Select Department...</option>
              <option value="Pharmacy">Pharmacy</option>
              <option value="Surgical">Surgical</option>
              <option value="Diagnostic">Diagnostic</option>
              <option value="Lab">Lab</option>
            </select>
          </div>
          <div class="form-group">
            <label>Supplier *</label>
            <input type="text" id="po-supplier" name="supplier" class="tbl-input" list="supplier-list"
              onchange="onSupplierSelect()" placeholder="Search Supplier..." required>
            <datalist id="supplier-list"></datalist>
            <input type="hidden" id="po-terms" name="terms">
          </div>
        </div>

        <div class="form-group" style="margin-top:20px;">
          <label>Notes / Supplier Invoice #</label>
          <input type="text" id="po-bill" name="bill_no" class="tbl-input"
            placeholder="Optional reference or invoice number">
        </div>

        <div class="table-responsive" style="margin-top: 25px; border: 1px solid var(--border); border-radius: 8px;">
          <table class="modern-table" id="po-items-table">
            <thead>
              <tr>
                <th style="width:40%">Item Description / SKU</th>
                <th style="width:15%">Qty</th>
                <th style="width:20%">Line Total</th>
                <th style="width:15%">Unit Cost</th>
                <th style="width:10%"></th>
              </tr>
            </thead>
            <tbody id="po-items-tbody"></tbody>
          </table>
          <div id="po-empty-msg"
            style="padding:40px; text-align:center; color:var(--text-muted); font-style:italic; background:var(--bg-app);">
            <span class="material-icons"
              style="font-size:32px; display:block; margin-bottom:10px; opacity:0.5;">playlist_add</span>
            No items added. Click "Add Item" to begin.
          </div>
        </div>

        <input type="hidden" id="po-total" name="total">
        <button type="submit" id="hidden-submit" style="display:none;"></button>
      </form>
    </div>
  </div>

  <div id="po-tab-history" class="sub-tab-content hidden">
    <div class="card">
      <div class="action-bar"
        style="flex-wrap:wrap; gap:10px; padding-bottom:15px; border-bottom:1px solid var(--border); margin-bottom:15px;">
        <div class="search-wrapper" style="flex:1; position:relative;">
          <span class="material-icons"
            style="position:absolute; left:10px; top:10px; color:var(--text-muted);">search</span>
          <input type="text" id="po-search" class="tbl-input" style="padding-left:35px;" placeholder="Search History..."
            onkeyup="filterPoHistory()">
        </div>
        <select id="filter-status" class="tbl-input" style="width:auto;" onchange="filterPoHistory()">
          <option value="">All Statuses</option>
          <option value="Pending Approval">Pending Approval</option>
          <option value="Approved">Approved</option>
          <option value="Pending Payment">Pending Payment</option>
          <option value="Partial">Partial</option>
          <option value="Paid">Paid</option>
          <option value="VOID">VOID</option>
        </select>
        <button class="btn btn-secondary" onclick="loadPoContext(true)"><span class="material-icons">refresh</span></button>
      </div>
      <div class="table-responsive" style="height: calc(100vh - 280px); overflow-y: auto;">
        <table class="modern-table">
          <thead>
            <tr>
              <th>PO ID</th>
              <th>Invoice #</th>
              <th>Supplier</th>
              <th>Total</th>
              <th>Payment</th>
              <th>Shipment</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="po-history-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<datalist id="item-master-list"></datalist>

<style>
  .po-header-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }

  /* Standardize Label Style */
  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* Ensure inputs are tall and clean */
  .tbl-input {
    width: 100%;
    padding: 10px 12px;
    /* Taller touch target */
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    /* Readable font size */
    color: var(--text-main);
    transition: all 0.2s;
  }

  .tbl-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  .read-only-input {
    background-color: var(--bg-app);
    color: var(--text-muted);
    pointer-events: none;
    border-color: transparent;
  }

  .status-select {
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-main);
    cursor: pointer;
  }
</style>

<script>
  let poContext = { suppliers: [], items: [], history: [] };
  let poItems = [];

  function switchPoTab(tab) {
    document.querySelectorAll('.sub-tab-content').forEach(el => el.classList.add('hidden'));
    document.getElementById(`po-tab-${tab}`).classList.remove('hidden');

    const btns = document.querySelectorAll('.sub-tab-btn');
    btns.forEach(el => el.classList.remove('active'));

    if (typeof event !== 'undefined' && event && event.target && event.target.classList.contains('sub-tab-btn')) {
      event.target.classList.add('active');
    } else {
      // Fallback for programmatic calls
      const targetBtn = Array.from(btns).find(b => b.getAttribute('onclick').includes(`'${tab}'`));
      if (targetBtn) targetBtn.classList.add('active');
    }

    if (poContext.suppliers.length === 0) loadPoContext();
  }

  async function loadPoContext(force = false) {
    // Use fetchData for history
    const history = await fetchData('poHistory', 'apiGetPOHistory', force);

    // We still need suppliers and items for the form
    runServer('apiGetPOContext').then(data => {
      poContext = data;
      poContext.history = history;
      APP.STORE.poHistory = history;

      const supList = document.getElementById('supplier-list');
      supList.innerHTML = '';
      data.suppliers.forEach(s => supList.appendChild(new Option(s['Supplier Name'], s['Supplier Name'])));

      const itemList = document.getElementById('item-master-list');
      itemList.innerHTML = '';
      data.items.forEach(i => itemList.appendChild(new Option(i['Item Name'], i['Item Name'])));

      if (!document.getElementById('po-id').value) {
        document.getElementById('po-id').value = data.newPoId;
        document.getElementById('po-date').valueAsDate = new Date();
        poItems = [];
        renderPoRows();
      }
      renderPoHistory(history);

      // Re-apply search filters if they exist (persists search after actions)
      const searchTerm = document.getElementById('po-search').value;
      const statusFilter = document.getElementById('filter-status').value;
      if (searchTerm || statusFilter) {
        filterPoHistory();
      }

      // --- DRAFT RESTORE ---
      DraftManager.checkAndPrompt('po', (draftData) => {
        document.getElementById('po-id').value = draftData.po_id;
        document.getElementById('po-date').value = draftData.date;
        document.getElementById('po-dept').value = draftData.dept;
        document.getElementById('po-supplier').value = draftData.supplier;
        document.getElementById('po-terms').value = draftData.terms;
        document.getElementById('po-bill').value = draftData.bill_no;
        poItems = draftData.items;
        renderPoRows();
      });
    });
  }

  // Trigger Autosave on any change
  document.getElementById('po-form').addEventListener('input', () => {
    const form = document.getElementById('po-form');
    const draftData = {
      po_id: form.po_id.value,
      date: form.date.value,
      dept: form.dept.value,
      supplier: form.supplier.value,
      terms: form.terms.value,
      bill_no: form.bill_no.value,
      items: poItems
    };
    DraftManager.save('po', draftData);
  });

  function checkPoId() {
    const id = document.getElementById('po-id').value.trim();
    if (!id) return;
    const exists = APP.STORE.poHistory.some(h => h['PO ID'] === id);
    if (exists) {
      if (confirm(`PO ${id} found. Do you want to load it for editing? This will clear current form data.`)) {
        loadPoForEdit(id);
      }
    }
  }

  function loadPoForEdit(id) {
    APP.Utils.showLoading(true);
    runServer('apiGetPOFullDetails', id).then(res => {
      APP.Utils.showLoading(false);
      if (res.success) {
        const data = res.data;
        document.getElementById('po-date').value = data.date;
        document.getElementById('po-dept').value = data.dept;
        document.getElementById('po-supplier').value = data.supplier;
        document.getElementById('po-terms').value = data.terms;
        document.getElementById('po-bill').value = data.bill_no;

        poItems = data.items.map(i => ({
          id: i.id,
          name: i.n,
          qty: Number(i.q),
          cost: Number(i.c),
          total: Number(i.t)
        }));

        renderPoRows();
        APP.Utils.showToast("PO loaded for edit.", 'success');
      } else {
        APP.Utils.showToast("Error loading PO: " + res.error, 'failed');
      }
    });
  }

  function onSupplierSelect() {
    const val = document.getElementById('po-supplier').value;
    const supplier = poContext.suppliers.find(s => s['Supplier Name'] === val);
    if (supplier) document.getElementById('po-terms').value = supplier['Payment Terms'] || 'COD';
  }

  function triggerPoSubmit() { document.getElementById('hidden-submit').click(); }

  function addPoRow() {
    poItems.push({ id: '', name: '', qty: "", cost: "", total: "" }); // Fix: total as number
    renderPoRows();
  }

  function removePoRow(idx) {
    poItems.splice(idx, 1);
    renderPoRows();
  }

  function renderPoRows() {
    const tbody = document.getElementById('po-items-tbody');
    const msg = document.getElementById('po-empty-msg');
    tbody.innerHTML = '';

    if (poItems.length === 0) {
      msg.style.display = 'block';
    } else {
      msg.style.display = 'none';
      poItems.forEach((item, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
        <td><input type="text" class="tbl-input" list="item-master-list" value="${item.name}" onchange="onItemSelect(${idx}, this)" placeholder="Item Name"></td>
        <td><input type="number" class="tbl-input" value="${item.qty}" min="1" onchange="calcUnitFromTotal(${idx}, 'qty', this)"></td>
        <td><input type="number" class="tbl-input" value="${item.total}" step="0.01" onchange="calcUnitFromTotal(${idx}, 'total', this)"></td>
        <td><input type="text" class="tbl-input read-only-input" readonly value="${item.cost === '' ? '' : Number(item.cost).toFixed(2)}" id="po-row-unit-${idx}"></td>
        <td class="text-center"><span class="material-icons" style="color:var(--danger); cursor:pointer; opacity:0.7;" onclick="removePoRow(${idx})">delete_outline</span></td>
      `;
        tbody.appendChild(tr);
      });
    }
    calcGrandTotal();
  }

  function onItemSelect(idx, input) {
    const val = input.value;
    poItems[idx].name = val;
    const item = poContext.items.find(i => i['Item Name'] === val || i['Stock ID'] === val);
    if (item) poItems[idx].id = item['Stock ID'];
  }

  function calcUnitFromTotal(idx, field, input) {
    const val = parseFloat(input.value) || 0;
    poItems[idx][field] = val;
    const q = poItems[idx].qty;
    const t = poItems[idx].total;
    poItems[idx].cost = (q > 0) ? (t / q) : 0;
    document.getElementById(`po-row-unit-${idx}`).value = poItems[idx].cost.toFixed(2);
    calcGrandTotal();
  }

  function calcGrandTotal() {
    // Fix: Ensure item.total is treated as number
    const total = poItems.reduce((acc, item) => acc + (parseFloat(item.total) || 0), 0);
    document.getElementById('po-total-display').textContent = total.toFixed(2);
    document.getElementById('po-total').value = total;
  }

  function resetPoForm() {
    document.getElementById('po-form').reset();
    poItems = [];
    renderPoRows();
    document.getElementById('po-id').value = "";
    DraftManager.clear('po');
    loadPoContext(true);
  }

  function handlePoSubmit(e) {
    e.preventDefault();
    if (poItems.length === 0) return APP.Utils.showToast("Please add at least one item.", 'failed');
    const form = document.getElementById('po-form');
    const formData = {
      po_id: form.po_id.value,
      date: form.date.value,
      dept: form.dept.value,
      supplier: form.supplier.value,
      terms: form.terms.value,
      bill_no: form.bill_no.value,
      total: form.total.value,
      items: poItems
    };
    APP.Utils.showLoading(true);
    runServer('apiSavePurchaseOrder', formData).then(res => {
      APP.Utils.showLoading(false);
      if (res.success) {
        APP.Utils.showToast("Purchase Order saved successfully.", 'saved');
        DraftManager.clear('po');
        resetPoForm();
      }
      else { APP.Utils.showToast("Save Error: " + res.error, 'failed'); }
    });
  }

  function previewPdfFromForm() {
    const id = document.getElementById('po-id').value;
    if (!id) return APP.Utils.showToast("PO ID missing.", 'failed');
    if (!confirm("Generate PDF for " + id + "?\nEnsure you have SAVED the order first.")) return;
    generatePoPdf(id);
  }

  function renderPoHistory(data) {
    const tbody = document.getElementById('po-history-tbody');
    tbody.innerHTML = '';
    data.forEach(row => {
      const isVoid = row['Status'] === 'VOID';

      const tr = document.createElement('tr');
      if (isVoid) {
        tr.style.opacity = '0.6';
        tr.style.background = '#fbeaea';
      }

      const tdId = document.createElement('td');
      tdId.style.fontWeight = 'bold';
      tdId.style.color = 'var(--primary)';
      tdId.textContent = row['PO ID'];

      const tdDate = document.createElement('td');
      tdDate.textContent = row['Bill #'] || '';

      const tdSup = document.createElement('td');
      tdSup.textContent = row['Supplier'];

      const tdTotal = document.createElement('td');
      tdTotal.style.fontWeight = 'bold';
      tdTotal.textContent = Number(row['Total']).toFixed(2);

      const tdStatus = document.createElement('td');
      const selStatus = document.createElement('select');
      selStatus.className = 'status-select';
      selStatus.disabled = isVoid;
      ['Pending Approval', 'Approved', 'Pending Payment', 'Partial', 'Paid', 'VOID'].forEach(opt => {
        const labels = { 'Pending Approval': 'Pending Approval', 'Approved': 'Approved', 'Pending Payment': 'Pending Payment', 'Partial': 'Partial', 'Paid': 'Paid', 'VOID': 'VOID' };
        const o = new Option(labels[opt] || opt, opt);
        if (row['Status'] === opt) o.selected = true;
        selStatus.appendChild(o);
      });
      selStatus.onchange = () => updatePoStatus(row['PO ID'], selStatus.value, 'PMT');
      tdStatus.appendChild(selStatus);

      const tdShip = document.createElement('td');
      const selShip = document.createElement('select');
      selShip.className = 'status-select';
      selShip.disabled = isVoid;
      ['Pending', 'Shipped', 'Received'].forEach(opt => {
        const o = new Option(opt, opt);
        if (row['Ship Status'] === opt) o.selected = true;
        selShip.appendChild(o);
      });
      selShip.onchange = () => updatePoStatus(row['PO ID'], selShip.value, 'SHIP');
      tdShip.appendChild(selShip);

      const tdActions = document.createElement('td');
      tdActions.style.display = 'flex';
      tdActions.style.gap = '5px';

      // 1. PDF Generator
      const btnPdf = document.createElement('button');
      btnPdf.className = 'btn btn-sm btn-secondary';
      btnPdf.innerHTML = '<span class="material-icons" style="font-size:16px">picture_as_pdf</span>';
      btnPdf.title = "Generate PDF";
      btnPdf.disabled = isVoid;
      btnPdf.onclick = () => generatePoPdf(row['PO ID']);
      tdActions.appendChild(btnPdf);

      // 2. View/Upload Signed PDF
      if (row['Signed URL']) {
        const btnView = document.createElement('button');
        btnView.className = 'btn btn-sm';
        btnView.style.color = 'var(--primary)';
        btnView.innerHTML = '<span class="material-icons" style="font-size:16px">visibility</span>';
        btnView.title = "View PO Document";
        btnView.onclick = () => window.open(row['Signed URL'], '_blank');
        tdActions.appendChild(btnView);
      }
      const btnUploadPo = document.createElement('button');
      btnUploadPo.className = 'btn btn-sm';
      btnUploadPo.style.color = 'var(--primary)';
      btnUploadPo.innerHTML = '<span class="material-icons" style="font-size:16px">upload</span>';
      btnUploadPo.title = row['Signed URL'] ? "Re-upload PO Document" : "Upload PO Document";
      btnUploadPo.onclick = () => triggerPoUpload(row['PO ID'], 'PO');
      btnUploadPo.disabled = isVoid;
      tdActions.appendChild(btnUploadPo);

      // 3. View/Upload Invoice
      if (row['Inv URL']) {
        const btnInv = document.createElement('button');
        btnInv.className = 'btn btn-sm';
        btnInv.style.color = '#8e44ad';
        btnInv.innerHTML = '<span class="material-icons" style="font-size:16px">receipt_long</span>';
        btnInv.title = "View Invoice";
        btnInv.onclick = () => window.open(row['Inv URL'], '_blank');
        tdActions.appendChild(btnInv);
      }
      const btnUploadInv = document.createElement('button');
      btnUploadInv.className = 'btn btn-sm';
      btnUploadInv.style.color = '#8e44ad';
      btnUploadInv.innerHTML = '<span class="material-icons" style="font-size:16px">upload_file</span>';
      btnUploadInv.title = row['Inv URL'] ? "Re-upload Invoice" : "Upload Invoice";
      btnUploadInv.onclick = () => triggerPoUpload(row['PO ID'], 'INV');
      btnUploadInv.disabled = isVoid;
      tdActions.appendChild(btnUploadInv);

      // 4. View/Upload Payment Receipt
      if (row['Pmt URL']) {
        const btnPmt = document.createElement('button');
        btnPmt.className = 'btn btn-sm';
        btnPmt.style.color = '#27ae60';
        btnPmt.innerHTML = '<span class="material-icons" style="font-size:16px">payments</span>';
        btnPmt.title = "View Payment Receipt";
        btnPmt.onclick = () => window.open(row['Pmt URL'], '_blank');
        tdActions.appendChild(btnPmt);
      }
      const btnUploadPmt = document.createElement('button');
      btnUploadPmt.className = 'btn btn-sm';
      btnUploadPmt.style.color = '#27ae60';
      btnUploadPmt.innerHTML = '<span class="material-icons" style="font-size:16px">payment</span>';
      btnUploadPmt.title = row['Pmt URL'] ? "Re-upload Payment Receipt" : "Upload Payment Receipt";
      btnUploadPmt.onclick = () => triggerPoUpload(row['PO ID'], 'PMT');
      btnUploadPmt.disabled = isVoid;
      tdActions.appendChild(btnUploadPmt);

      if (row['Item History URL']) {
        const btnViewHist = document.createElement('button');
        btnViewHist.className = 'btn btn-sm';
        btnViewHist.style.color = '#e67e22';
        btnViewHist.innerHTML = '<span class="material-icons" style="font-size:16px">description</span>';
        btnViewHist.title = "View Item History Report";
        btnViewHist.onclick = () => window.open(row['Item History URL'], '_blank');
        tdActions.appendChild(btnViewHist);
      }
      const btnUploadHist = document.createElement('button');
      btnUploadHist.className = 'btn btn-sm';
      btnUploadHist.style.color = '#e67e22';
      btnUploadHist.innerHTML = '<span class="material-icons" style="font-size:16px">history</span>';
      btnUploadHist.title = row['Item History URL'] ? "Re-upload Item History Report" : "Upload Item History Report (Excel/CSV)";
      btnUploadHist.onclick = () => triggerPoUpload(row['PO ID'], 'HIST');
      btnUploadHist.disabled = isVoid;
      tdActions.appendChild(btnUploadHist);

      if (!isVoid) {
        const btnVoid = document.createElement('button');
        btnVoid.className = 'btn btn-sm btn-danger';
        btnVoid.style.padding = '4px 8px';
        btnVoid.innerHTML = '<span class="material-icons" style="font-size:16px">block</span>';
        btnVoid.onclick = () => voidPo(row['PO ID']);
        tdActions.appendChild(btnVoid);
      }

      tr.appendChild(tdId);
      tr.appendChild(tdDate);
      tr.appendChild(tdSup);
      tr.appendChild(tdTotal);
      tr.appendChild(tdStatus);
      tr.appendChild(tdShip);
      tr.appendChild(tdActions);

      tbody.appendChild(tr);
    });
  }

  function updatePoStatus(id, val, type) {
    runServer('apiUpdatePOStatus', id, val, type).then(res => {
      if (res.success) {
        APP.Utils.showToast("Status updated successfully.", 'success');
        loadPoContext(true); // Refresh STORE
      } else APP.Utils.showToast("Error updating status: " + res.error, 'failed');
    });
  }

  function voidPo(id) {
    if (!confirm(`Are you sure you want to VOID ${id}?\nThis cannot be undone.`)) return;
    APP.Utils.showLoading(true);
    runServer('apiVoidPurchaseOrder', id).then(res => {
      APP.Utils.showLoading(false);
      if (res.success) {
        APP.Utils.showToast("PO voided successfully.", 'success');
        loadPoContext(true);
      }
      else { APP.Utils.showToast("Void Error: " + res.error, 'failed'); }
    });
  }

  function generatePoPdf(id) {
    APP.Utils.showLoading(true);
    runServer('apiGeneratePoPdf', id).then(res => {
      APP.Utils.showLoading(false);
      if (res.success) {
        APP.Utils.showToast("PO PDF generated.", 'success');
        if (res.url) window.open(res.url, '_blank');
        loadPoContext(true);
      }
      else { APP.Utils.showToast("PDF Error: " + res.error, 'failed'); }
    });
  }

  function filterPoHistory() {
    const term = document.getElementById('po-search').value.toLowerCase();
    const statusFilter = document.getElementById('filter-status').value;
    const filtered = APP.STORE.poHistory.filter(h => {
      const matchesTerm = h['PO ID'].toLowerCase().includes(term) || h['Supplier'].toLowerCase().includes(term);
      const matchesStatus = statusFilter ? h['Status'] === statusFilter : true;
      return matchesTerm && matchesStatus;
    });
    renderPoHistory(filtered);
  }

function triggerPoUpload(poId, fileType) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = fileType === 'HIST' 
      ? '.xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv' 
      : (fileType === 'PMT' ? 'application/pdf,image/png,image/jpeg' : 'application/pdf');
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      // Validate file type
      const validTypes = fileType === 'PMT' 
        ? ['application/pdf', 'image/png', 'image/jpeg'] 
        : (fileType === 'HIST'
          ? ['application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', 'application/vnd.ms-excel', 'text/csv', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet']
          : ['application/pdf']);
      if (fileType === 'HIST') {
        const histValid = file.name.match(/\.(xlsx|xls|csv)$/i) || file.type.includes('spreadsheet') || file.type.includes('excel') || file.type === 'text/csv';
        if (!histValid) {
          return APP.Utils.showToast('Please select an Excel or CSV file', 'failed');
        }
      } else if (!validTypes.includes(file.type)) {
         return APP.Utils.showToast(fileType === 'PMT' ? 'Please select a PDF, PNG, or JPEG file' : 'Please select a PDF file', 'failed');
      }
      const reader = new FileReader();
      reader.onload = function(ev) {
        const base64 = ev.target.result.split(',')[1];
        // Determine file extension and name prefix
        let filePrefix, ext;
        if (fileType === 'PO') {
          filePrefix = 'SIGNED_PO';
          ext = '.pdf';
        } else if (fileType === 'INV') {
          filePrefix = 'INVOICE';
          ext = '.pdf';
        } else if (fileType === 'PMT') {
          filePrefix = 'PAYMENT_RECEIPT';
          if (file.type === 'image/png') ext = '.png';
          else if (file.type === 'image/jpeg') ext = '.jpg';
          else ext = '.pdf';
        } else if (fileType === 'HIST') {
          filePrefix = 'ITEM_HISTORY';
          ext = file.name.toLowerCase().endsWith('.csv') ? '.csv' : '.xlsx';
        }
        const fileName = `${poId}_${filePrefix}${ext}`;
        APP.Utils.showLoading(true);
        runServer('apiUploadPoAttachment', poId, fileType, base64, file.type, fileName).then(res => {
          APP.Utils.showLoading(false);
          if (res.success) {
            let msg = 'File uploaded successfully.';
            if (fileType === 'PO') msg = 'PO document uploaded successfully.';
            else if (fileType === 'INV') msg = 'Invoice uploaded successfully.';
            else if (fileType === 'PMT') msg = 'Payment receipt uploaded successfully. Status changed to Paid.';
            else if (fileType === 'HIST') msg = 'Item History Report uploaded successfully.';
            APP.Utils.showToast(msg, 'success');
            loadPoContext(true);
          } else {
            APP.Utils.showToast("Upload Failed: " + res.error, 'failed');
          }
        });
      };
      reader.readAsDataURL(file);
    };
    input.click();
  }
</script>
