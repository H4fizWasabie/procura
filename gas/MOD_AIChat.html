<!-- MOD_AIChat.html — AI Chat Widget (Phase 2 Upgrade) -->

<style>
    /* ===== AI CHAT FAB ===== */
    #ai-chat-fab {
        position: fixed;
        bottom: 28px;
        right: 28px;
        z-index: 1500;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    #ai-chat-fab:hover {
        transform: scale(1.08);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    #ai-chat-fab .material-icons {
        font-size: 26px;
    }

    #ai-chat-fab::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid var(--primary);
        opacity: 0;
        animation: ai-fab-ping 2.5s ease-out infinite;
    }

    @keyframes ai-fab-ping {
        0% {
            transform: scale(1);
            opacity: 0.6;
        }

        100% {
            transform: scale(1.6);
            opacity: 0;
        }
    }

    /* ===== CHAT PANEL ===== */
    #ai-chat-panel {
        position: fixed;
        bottom: 96px;
        right: 28px;
        z-index: 1501;
        width: 420px;
        max-width: calc(100vw - 40px);
        height: 560px;
        max-height: calc(100vh - 140px);
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.05);
        display: none;
        flex-direction: column;
        overflow: hidden;
        animation: ai-panel-in 0.25s ease-out;
    }

    #ai-chat-panel.open {
        display: flex;
    }

    @keyframes ai-panel-in {
        from {
            opacity: 0;
            transform: translateY(16px) scale(0.96);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .ai-chat-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 18px;
        background: var(--nav-bg);
        color: #fff;
        flex-shrink: 0;
    }

    .ai-chat-header .material-icons {
        font-size: 22px;
        opacity: 0.85;
    }

    .ai-chat-header-title {
        flex: 1;
        font-weight: 700;
        font-size: 0.92rem;
        letter-spacing: -0.02em;
    }

    .ai-chat-header-sub {
        font-size: 0.7rem;
        opacity: 0.6;
        font-weight: 400;
    }

    .ai-chat-close {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.7);
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        transition: 0.15s;
    }

    .ai-chat-close:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
    }

    .ai-chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scroll-behavior: smooth;
    }

    .ai-msg {
        max-width: 88%;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 0.84rem;
        line-height: 1.55;
        word-wrap: break-word;
        animation: ai-msg-in 0.2s ease-out;
    }

    @keyframes ai-msg-in {
        from {
            opacity: 0;
            transform: translateY(6px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .ai-msg.user {
        align-self: flex-end;
        background: var(--primary);
        color: #fff;
        border-bottom-right-radius: 4px;
    }

    .ai-msg.bot {
        align-self: flex-start;
        background: var(--bg-app);
        color: var(--text-main);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
    }

    .ai-msg.bot strong {
        color: var(--primary);
    }

    .ai-msg.error {
        align-self: flex-start;
        background: rgba(239, 68, 68, 0.08);
        color: var(--danger);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-bottom-left-radius: 4px;
        font-size: 0.82rem;
    }

    /* #24 — Typing context */
    .ai-typing {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: var(--bg-app);
        border: 1px solid var(--border);
        border-radius: 14px;
        border-bottom-left-radius: 4px;
        font-size: 0.78rem;
        color: var(--text-muted);
    }

    .ai-typing-dots {
        display: flex;
        gap: 4px;
    }

    .ai-typing-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-muted);
        animation: ai-bounce 1.2s ease-in-out infinite;
    }

    .ai-typing-dot:nth-child(2) {
        animation-delay: 0.15s;
    }

    .ai-typing-dot:nth-child(3) {
        animation-delay: 0.3s;
    }

    @keyframes ai-bounce {

        0%,
        60%,
        100% {
            transform: translateY(0);
            opacity: 0.4;
        }

        30% {
            transform: translateY(-5px);
            opacity: 1;
        }
    }

    /* Input bar */
    .ai-chat-input-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-top: 1px solid var(--border);
        background: var(--bg-card);
        flex-shrink: 0;
    }

    #ai-chat-input {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.84rem;
        background: var(--bg-app);
        color: var(--text-main);
        outline: none;
        resize: none;
        max-height: 80px;
        min-height: 40px;
        font-family: inherit;
        transition: border-color 0.2s;
    }

    #ai-chat-input:focus {
        border-color: var(--primary);
    }

    #ai-chat-input::placeholder {
        color: var(--text-muted);
    }

    .ai-chat-send {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: none;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.15s;
        flex-shrink: 0;
    }

    .ai-chat-send:hover {
        background: var(--primary-dark);
    }

    .ai-chat-send:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .ai-chat-send .material-icons {
        font-size: 20px;
    }

    /* Welcome */
    .ai-welcome {
        text-align: center;
        padding: 30px 20px;
        color: var(--text-muted);
    }

    .ai-welcome .material-icons {
        font-size: 40px;
        color: var(--primary);
        opacity: 0.5;
        margin-bottom: 12px;
    }

    .ai-welcome-title {
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--text-main);
        margin-bottom: 6px;
    }

    .ai-welcome-sub {
        font-size: 0.8rem;
        line-height: 1.5;
        margin-bottom: 18px;
    }

    .ai-chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
    }

    .ai-chip {
        padding: 6px 12px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-main);
        font-size: 0.74rem;
        font-weight: 500;
        cursor: pointer;
        transition: 0.15s;
    }

    .ai-chip:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: rgba(99, 102, 241, 0.05);
    }

    /* #16 — Suggestion chips (inline in bot messages) */
    .ai-suggest-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
    }

    .ai-suggest-chip {
        padding: 4px 10px;
        border-radius: 16px;
        border: 1px solid var(--primary);
        background: transparent;
        color: var(--primary);
        font-size: 0.72rem;
        font-weight: 500;
        cursor: pointer;
        transition: 0.15s;
    }

    .ai-suggest-chip:hover {
        background: var(--primary);
        color: #fff;
    }

    /* #25 — Collapsible data tables */
    .ai-table-wrap {
        margin: 8px 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
    }

    .ai-table-toggle {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px;
        background: var(--bg-app);
        cursor: pointer;
        font-size: 0.74rem;
        font-weight: 600;
        color: var(--text-muted);
        border: none;
        width: 100%;
        text-align: left;
    }

    .ai-table-toggle:hover {
        color: var(--primary);
    }

    .ai-table-toggle .material-icons {
        font-size: 16px;
        transition: transform 0.2s;
    }

    .ai-table-wrap.collapsed .ai-table-body {
        display: none;
    }

    .ai-table-wrap.collapsed .ai-table-toggle .material-icons {
        transform: rotate(-90deg);
    }

    .ai-data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.74rem;
    }

    .ai-data-table th {
        background: var(--bg-app);
        padding: 5px 8px;
        text-align: left;
        font-weight: 600;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
    }

    .ai-data-table td {
        padding: 4px 8px;
        border-bottom: 1px solid rgba(128, 128, 128, 0.1);
        color: var(--text-main);
    }

    .ai-data-table tr:hover td {
        background: rgba(99, 102, 241, 0.03);
    }

    /* Chart */
    .ai-chart-wrap {
        width: 100%;
        margin: 8px 0;
        padding: 10px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
    }

    .ai-chart-title {
        font-size: 0.78rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-main);
    }

    .ai-chart-bar-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 0.72rem;
    }

    .ai-chart-label {
        min-width: 60px;
        max-width: 80px;
        text-align: right;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .ai-chart-bar-bg {
        flex: 1;
        height: 16px;
        background: var(--bg-app);
        border-radius: 4px;
        overflow: hidden;
    }

    .ai-chart-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--primary), var(--primary-dark));
        border-radius: 4px;
        transition: width 0.4s ease-out;
        min-width: 2px;
    }

    .ai-chart-val {
        min-width: 40px;
        text-align: left;
        color: var(--text-main);
        font-weight: 600;
    }

    /* #24 — Tools badge */
    .ai-tools-badge {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        margin-top: 6px;
        padding: 2px 8px;
        border-radius: 10px;
        background: rgba(99, 102, 241, 0.08);
        font-size: 0.66rem;
        color: var(--text-muted);
    }

    .ai-tools-badge .material-icons {
        font-size: 12px;
    }

    /* Scrollbar */
    .ai-chat-messages::-webkit-scrollbar {
        width: 5px;
    }

    .ai-chat-messages::-webkit-scrollbar-track {
        background: transparent;
    }

    .ai-chat-messages::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
    }

    /* Mobile */
    @media (max-width: 480px) {
        #ai-chat-panel {
            right: 8px;
            bottom: 80px;
            width: calc(100vw - 16px);
            height: calc(100vh - 120px);
            border-radius: 12px;
        }

        #ai-chat-fab {
            bottom: 16px;
            right: 16px;
            width: 50px;
            height: 50px;
        }
    }
</style>

<!-- FAB -->
<button id="ai-chat-fab" onclick="toggleAIChat()" title="AI Assistant">
    <span class="material-icons">smart_toy</span>
</button>

<!-- Chat Panel -->
<div id="ai-chat-panel">
    <div class="ai-chat-header">
        <span class="material-icons">psychology</span>
        <div>
            <div class="ai-chat-header-title">ProcurePilot AI</div>
            <div class="ai-chat-header-sub">Full Data Assistant</div>
        </div>
        <button class="ai-chat-close" onclick="clearAIChat()" title="New Conversation">
            <span class="material-icons">add_comment</span>
        </button>
        <button class="ai-chat-close" onclick="toggleAIChat()" title="Close">
            <span class="material-icons">close</span>
        </button>
    </div>

    <div class="ai-chat-messages" id="ai-chat-messages">
        <div class="ai-welcome" id="ai-welcome">
            <span class="material-icons">auto_awesome</span>
            <div class="ai-welcome-title">How can I help?</div>
            <div class="ai-welcome-sub">Full access to inventory, suppliers, POs, movement, analytics, and anomaly
                detection.</div>
            <div class="ai-chip-row">
                <span class="ai-chip" onclick="aiChatQuickAsk(this)">What items need restocking?</span>
                <span class="ai-chip" onclick="aiChatQuickAsk(this)">Run a health check</span>
                <span class="ai-chip" onclick="aiChatQuickAsk(this)">Top 5 most expensive items</span>
                <span class="ai-chip" onclick="aiChatQuickAsk(this)">Show recent purchase orders</span>
            </div>
        </div>
    </div>

    <div class="ai-chat-input-bar">
        <textarea id="ai-chat-input" rows="1" placeholder="Ask anything about your data..."
            onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendAIChat();}"></textarea>
        <button class="ai-chat-send" id="ai-chat-send-btn" onclick="sendAIChat()">
            <span class="material-icons">send</span>
        </button>
    </div>
</div>

<script>
    // ===== AI CHAT CLIENT (Phase 2) =====
    let _aiChatOpen = false;
    let _aiChatBusy = false;
    let _aiChatHistory = [];

    // #24 — Cycling status messages
    const _AI_STATUS_MSGS = [
        'Searching databases...', 'Analyzing data...', 'Cross-referencing records...',
        'Crunching numbers...', 'Checking inventory...', 'Reviewing PO records...',
        'Scanning for patterns...', 'Processing results...'
    ];
    let _aiStatusIdx = 0;
    let _aiStatusTimer = null;

    function toggleAIChat() {
        _aiChatOpen = !_aiChatOpen;
        const panel = document.getElementById('ai-chat-panel');
        const fab = document.getElementById('ai-chat-fab');
        if (_aiChatOpen) {
            panel.classList.add('open');
            fab.querySelector('.material-icons').textContent = 'close';
            fab.style.background = 'var(--nav-bg)';
            setTimeout(() => document.getElementById('ai-chat-input').focus(), 200);
        } else {
            panel.classList.remove('open');
            fab.querySelector('.material-icons').textContent = 'smart_toy';
            fab.style.background = '';
        }
    }

    function aiChatQuickAsk(el) {
        document.getElementById('ai-chat-input').value = el.textContent.trim();
        sendAIChat();
    }

    function sendAIChat() {
        if (_aiChatBusy) return;
        const input = document.getElementById('ai-chat-input');
        const msg = input.value.trim();
        if (!msg) return;

        const welcome = document.getElementById('ai-welcome');
        if (welcome) welcome.style.display = 'none';

        _addChatBubble(msg, 'user');
        input.value = '';
        input.style.height = 'auto';

        _aiChatBusy = true;
        _setAIChatLoading(true);

        // #3 — Page context
        let currentView = '';
        try {
            const activeEl = document.querySelector('.nav-item.active');
            if (activeEl) currentView = activeEl.getAttribute('data-view') || activeEl.textContent.trim();
        } catch (e) { }

        const payload = {
            message: msg,
            history: _aiChatHistory.slice(-20),
            currentView: currentView
        };

        google.script.run
            .withSuccessHandler(function (res) {
                _setAIChatLoading(false);
                _aiChatBusy = false;

                if (res.success) {
                    _aiChatHistory.push({ role: 'user', content: msg });
                    _aiChatHistory.push({ role: 'assistant', content: res.answer });
                    if (_aiChatHistory.length > 40) _aiChatHistory = _aiChatHistory.slice(-40);

                    _addChatBubble(res.answer, 'bot', res.toolsUsed || []);
                } else {
                    _addChatBubble(res.error || 'Something went wrong.', 'error');
                }
            })
            .withFailureHandler(function (err) {
                _setAIChatLoading(false);
                _aiChatBusy = false;
                _addChatBubble('Connection error: ' + (err.message || 'Please try again.'), 'error');
            })
            .askAgenticAI(payload);
    }

    function _addChatBubble(text, type, toolsUsed) {
        const container = document.getElementById('ai-chat-messages');
        const bubble = document.createElement('div');
        bubble.className = 'ai-msg ' + type;

        if (type === 'bot') {
            // Extract suggestions before formatting
            let suggestions = [];
            const suggestMatch = text.match(/\[SUGGEST\](.*?)\[\/SUGGEST\]/s);
            if (suggestMatch) {
                suggestions = suggestMatch[1].split('|').map(s => s.trim()).filter(s => s);
            }

            // Extract chart data
            const chartMatch = text.match(/\[CHART\](.*?)\[\/CHART\]/s);

            // Format main text
            bubble.innerHTML = _formatAIResponse(text);

            // #25 — Render markdown tables as collapsible HTML
            _renderTables(bubble);

            // #14 — Chart
            if (chartMatch) {
                try {
                    const chart = _renderInlineChart(JSON.parse(chartMatch[1]));
                    if (chart) bubble.appendChild(chart);
                } catch (e) { }
            }

            // #24 — Tools used badge
            if (toolsUsed && toolsUsed.length > 0) {
                const badge = document.createElement('div');
                badge.className = 'ai-tools-badge';
                badge.innerHTML = '<span class="material-icons">build</span>' + toolsUsed.map(_friendlyToolName).join(' → ');
                bubble.appendChild(badge);
            }

            // #16 — Suggestion chips
            if (suggestions.length > 0) {
                const row = document.createElement('div');
                row.className = 'ai-suggest-row';
                suggestions.forEach(s => {
                    const chip = document.createElement('button');
                    chip.className = 'ai-suggest-chip';
                    chip.textContent = s;
                    chip.onclick = function () { document.getElementById('ai-chat-input').value = s; sendAIChat(); };
                    row.appendChild(chip);
                });
                bubble.appendChild(row);
            }
        } else {
            bubble.textContent = text;
        }

        container.appendChild(bubble);
        container.scrollTop = container.scrollHeight;
    }

    // #24 — Friendly tool names for badge
    function _friendlyToolName(name) {
        const map = {
            searchInventoryItem: 'Inventory', getSupplierInfo: 'Suppliers', querySheet: 'Sheet Query',
            getPurchaseOrderDetails: 'PO Details', getItemMovementHistory: 'Movement',
            getDashboardKPIs: 'Dashboard', aggregateData: 'Aggregation', getTopN: 'Ranking',
            joinSheets: 'Cross-Join', getSnapshotSummary: 'Snapshot', detectAnomalies: 'Anomaly Scan'
        };
        return map[name] || name;
    }

    function _formatAIResponse(text) {
        if (!text) return '';
        return text
            .replace(/\[CHART\].*?\[\/CHART\]/gs, '')
            .replace(/\[SUGGEST\].*?\[\/SUGGEST\]/gs, '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/^[-•]\s+/gm, '• ')
            .replace(/\n/g, '<br>')
            .replace(/(<br>\s*)+$/g, '');
    }

    // #25 — Parse markdown tables in rendered HTML and convert to collapsible tables
    function _renderTables(bubble) {
        const html = bubble.innerHTML;
        // Match markdown-style tables in the rendered HTML (after <br> replacement)
        // Pattern: header row | separator row | data rows
        const tableRegex = /(\|[^<]+\|(?:<br>)?\s*\|[-|\s:]+\|(?:<br>(?:\|[^<]+\|))*)/g;
        const matches = html.match(tableRegex);
        if (!matches) return;

        matches.forEach((tableStr, idx) => {
            const rows = tableStr.split('<br>').filter(r => r.trim().startsWith('|'));
            if (rows.length < 3) return; // need header + separator + at least 1 row

            const parseRow = (r) => r.split('|').map(c => c.trim()).filter((c, i, a) => i > 0 && i < a.length);
            const headers = parseRow(rows[0]);
            // rows[1] is separator — skip
            const dataRows = rows.slice(2).map(parseRow);

            if (headers.length === 0 || dataRows.length === 0) return;

            // Build HTML table
            let tableHTML = '<div class="ai-table-wrap">';
            tableHTML += `<button class="ai-table-toggle" onclick="this.parentElement.classList.toggle(\'collapsed\')"><span class="material-icons">expand_more</span>${dataRows.length} rows</button>`;
            tableHTML += '<div class="ai-table-body"><table class="ai-data-table"><thead><tr>';
            headers.forEach(h => { tableHTML += `<th>${h}</th>`; });
            tableHTML += '</tr></thead><tbody>';
            dataRows.forEach(dr => {
                tableHTML += '<tr>';
                dr.forEach(cell => { tableHTML += `<td>${cell}</td>`; });
                tableHTML += '</tr>';
            });
            tableHTML += '</tbody></table></div></div>';

            // Replace the markdown table text with the HTML table
            bubble.innerHTML = bubble.innerHTML.replace(tableStr, tableHTML);
        });
    }

    function _renderInlineChart(data) {
        if (!data || !data.labels || !data.data) return null;
        const wrap = document.createElement('div');
        wrap.className = 'ai-chart-wrap';
        if (data.title) {
            const t = document.createElement('div');
            t.className = 'ai-chart-title';
            t.textContent = data.title;
            wrap.appendChild(t);
        }
        const maxVal = Math.max(...data.data, 1);
        data.labels.forEach((label, i) => {
            const val = data.data[i] || 0;
            const pct = Math.round((val / maxVal) * 100);
            const row = document.createElement('div');
            row.className = 'ai-chart-bar-row';
            row.innerHTML = `<span class="ai-chart-label" title="${label}">${label}</span><div class="ai-chart-bar-bg"><div class="ai-chart-bar-fill" style="width:${pct}%"></div></div><span class="ai-chart-val">${typeof val === 'number' && val >= 1000 ? (val / 1000).toFixed(1) + 'k' : val}</span>`;
            wrap.appendChild(row);
        });
        return wrap;
    }

    // #24 — Animated typing with cycling context messages
    function _setAIChatLoading(show) {
        const container = document.getElementById('ai-chat-messages');
        const btn = document.getElementById('ai-chat-send-btn');
        btn.disabled = show;

        const old = container.querySelector('.ai-typing');
        if (old) old.remove();
        if (_aiStatusTimer) { clearInterval(_aiStatusTimer); _aiStatusTimer = null; }

        if (show) {
            _aiStatusIdx = 0;
            const typing = document.createElement('div');
            typing.className = 'ai-typing';
            typing.innerHTML = '<div class="ai-typing-dots"><div class="ai-typing-dot"></div><div class="ai-typing-dot"></div><div class="ai-typing-dot"></div></div><span class="ai-typing-text">' + _AI_STATUS_MSGS[0] + '</span>';
            container.appendChild(typing);
            container.scrollTop = container.scrollHeight;

            // Cycle messages
            _aiStatusTimer = setInterval(() => {
                _aiStatusIdx = (_aiStatusIdx + 1) % _AI_STATUS_MSGS.length;
                const txt = typing.querySelector('.ai-typing-text');
                if (txt) txt.textContent = _AI_STATUS_MSGS[_aiStatusIdx];
            }, 2500);
        }
    }

    function clearAIChat() {
        _aiChatHistory = [];
        const container = document.getElementById('ai-chat-messages');
        container.innerHTML = '';
        const welcome = document.createElement('div');
        welcome.className = 'ai-welcome';
        welcome.id = 'ai-welcome';
        welcome.innerHTML = `
      <span class="material-icons">auto_awesome</span>
      <div class="ai-welcome-title">How can I help?</div>
      <div class="ai-welcome-sub">Full access to inventory, suppliers, POs, movement, analytics, and anomaly detection.</div>
      <div class="ai-chip-row">
        <span class="ai-chip" onclick="aiChatQuickAsk(this)">What items need restocking?</span>
        <span class="ai-chip" onclick="aiChatQuickAsk(this)">Run a health check</span>
        <span class="ai-chip" onclick="aiChatQuickAsk(this)">Top 5 most expensive items</span>
        <span class="ai-chip" onclick="aiChatQuickAsk(this)">Show recent purchase orders</span>
      </div>
    `;
        container.appendChild(welcome);
        _aiChatBusy = false;
        document.getElementById('ai-chat-send-btn').disabled = false;
    }

    document.addEventListener('input', function (e) {
        if (e.target.id === 'ai-chat-input') {
            e.target.style.height = 'auto';
            e.target.style.height = Math.min(e.target.scrollHeight, 80) + 'px';
        }
    });
</script>
