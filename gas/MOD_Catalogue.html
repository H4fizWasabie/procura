<div id="view-catalogue" class="view-section hidden">
  <div class="module-header">
    <h2><span class="material-icons">library_books</span> Global Catalogue Search</h2>
  </div>

  <div class="card">
    <div class="action-bar"
      style="border-bottom:1px solid #e2e8f0; padding:15px; margin-bottom:15px; display:flex; gap:15px; align-items:center;">
      <div class="search-wrapper" style="flex:1; position:relative;">
        <span class="material-icons" style="position:absolute; left:12px; top:12px; color:#94a3b8;">search</span>
        <input type="text" id="cat-global-search" class="tbl-input" style="padding-left:40px;"
          placeholder="Search product name or SKU across ALL suppliers..."
          onkeydown="if(event.key==='Enter') performGlobalSearch()">
      </div>
      <button class="btn btn-primary" onclick="performGlobalSearch()">
        <span class="material-icons">search</span> Search Catalogue
      </button>
    </div>

    <div class="table-responsive" style="height: calc(100vh - 280px); overflow-y: auto;">
      <table class="modern-table">
        <thead>
          <tr>
            <th style="width:15%">Supplier (Sheet)</th>
            <th style="width:10%">ID / Ref</th>
            <th style="width:30%">Description</th>
            <th style="width:10%" class="text-right">Price</th>
            <th style="width:20%">Bonus / Tiers</th>
            <th style="width:5%" class="text-center">Action</th>
          </tr>
        </thead>
        <tbody id="catalogue-tbody"></tbody>
      </table>

      <div id="cat-loading" class="empty-state hidden">
        <span class="btn-spinner"
          style="border-top-color: var(--primary); width: 30px; height: 30px; display:inline-block;"></span>
        <p>Scanning all supplier sheets... this may take a few seconds.</p>
      </div>

      <div id="cat-empty" class="empty-state">
        <span class="material-icons" style="font-size:48px; color:#cbd5e1;">travel_explore</span>
        <p>Enter a keyword and press Enter to compare prices.</p>
      </div>
    </div>
  </div>
</div>

<script>
  async function performGlobalSearch() {
    const query = document.getElementById('cat-global-search').value.trim();
    if (query.length < 2) return APP.Utils.showToast("Enter at least 2 characters.");

    const tbody = document.getElementById('catalogue-tbody');
    const loading = document.getElementById('cat-loading');
    const empty = document.getElementById('cat-empty');

    tbody.innerHTML = '';
    loading.classList.remove('hidden');
    empty.classList.add('hidden');

    runServer('apiSearchCatalogueGlobal', query).then(data => {
      loading.classList.add('hidden');
      if (!data || data.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      renderCatalogue(data);
    }).catch(err => {
      loading.classList.add('hidden');
      APP.Utils.showToast("Search failed: " + err.message);
    });
  }

  function renderCatalogue(data) {
    const tbody = document.getElementById('catalogue-tbody');
    tbody.innerHTML = '';

    data.forEach(item => {
      const tr = document.createElement('tr');
      tr.className = 'selectable-item';

      tr.innerHTML = `
      <td style="font-weight:700; color:var(--text-muted); font-size:0.8rem;">${APP.Utils.escapeHtml(item.supplier)}</td>
      <td style="font-weight:700; color:var(--primary); font-family:monospace;">${APP.Utils.escapeHtml(item.id || '-')}</td>
      <td style="font-weight:600;">${APP.Utils.escapeHtml(item.name || 'Untitled')}</td>
      <td class="text-right" style="font-weight:800; color:var(--text-main);">RM ${Number(item.cost || 0).toFixed(2)}</td>
      <td style="font-size:0.8rem; color:var(--text-muted);">
        ${item.bonus && item.bonus !== '-' ? `<span style="background:var(--bg-app); color:var(--primary); padding:2px 6px; border-radius:4px; font-weight:600; border:1px solid var(--border);">${APP.Utils.escapeHtml(item.bonus)}</span>` : '-'}
      </td>
      <td class="text-center">
        <button class="btn btn-sm btn-primary" onclick="copyToDraft('${APP.Utils.escapeHtml(item.id)}', '${APP.Utils.escapeHtml(item.name)}', ${item.cost})">
          <span class="material-icons" style="font-size:16px;">content_copy</span>
        </button>
      </td>
    `;
      tbody.appendChild(tr);
    });
  }

  function copyToDraft(id, name, cost) {
    const choice = confirm(`Add "${name}" to Purchase Order draft?`);
    if (choice) {
      const draft = DraftManager.load('po') || { items: [] };
      draft.data = draft.data || { items: [] };
      draft.data.items = draft.data.items || [];
      draft.data.items.push({
        stockId: id,
        name: name,
        qty: 1,
        cost: cost,
        total: cost,
        uom: 'UNIT'
      });
      DraftManager.save('po', draft.data);
      APP.Utils.showToast("Item added to PO Draft!");
    }
  }
</script>
