<div id="view-workflow" class="view-section hidden">
  <div class="module-header">
    <h2><span class="material-icons">fact_check</span> Workflow Command Center</h2>

    <div style="display:flex; align-items:center; gap:10px;">
      <div style="text-align:right; border-right:1px solid #ddd; padding-right:15px; margin-right:5px;">
        <div style="font-size:0.7rem; font-weight:bold; color:#95a5a6; text-transform:uppercase;">Selected</div>
        <div id="wf-count" style="font-size:1.5rem; font-weight:bold; color:var(--primary); line-height:1;">0</div>
      </div>
      <button class="btn btn-primary" onclick="initiateBatch()">
        <span class="material-icons">send</span> Preview & Send
      </button>
    </div>
  </div>

  <div class="sub-tabs">
    <button class="sub-tab-btn active" onclick="switchWorkflowMode('APPROVAL')">
      <span class="material-icons" style="font-size:16px;">verified_user</span> Manager Approval
    </button>
    <button class="sub-tab-btn" onclick="switchWorkflowMode('PAYMENT')">
      <span class="material-icons" style="font-size:16px;">payments</span> Finance Request
    </button>
  </div>

  <div class="card">
    <div class="action-bar"
      style="border-bottom:1px solid #e2e8f0; padding:15px; margin-bottom:15px; display:flex; gap:15px; align-items:center;">
      <div class="search-wrapper" style="flex:1; position:relative;">
        <span class="material-icons" style="position:absolute; left:12px; top:12px; color:#94a3b8;">search</span>
        <input type="text" id="wf-search" class="tbl-input" style="padding-left:40px;" placeholder="Search POs..."
          onkeyup="loadWorkflow()">
      </div>
      <button class="btn btn-secondary" onclick="loadWorkflow(true)">
        <span class="material-icons">refresh</span> Sync
      </button>
    </div>

    <div class="table-responsive" style="height: calc(100vh - 280px); overflow-y: auto;">
      <table class="modern-table">
        <thead>
          <tr>
            <th style="width:40px;"><input type="checkbox" onchange="toggleAllWf(this)"></th>
            <th>PO ID</th>
            <th>Supplier</th>
            <th>Dept</th>
            <th style="text-align:right;">Amount</th>
            <th style="text-align:center;">Docs</th>
          </tr>
        </thead>
        <tbody id="wf-tbody"></tbody>
      </table>
      <div id="wf-empty" class="empty-state hidden" style="padding:40px; text-align:center; color:#94a3b8;">
        <span class="material-icons" style="color:#27ae60; font-size:48px; opacity:0.8;">done_all</span>
        <p>No active items for this workflow.</p>
      </div>
    </div>
  </div>
</div>

<div id="wf-modal" class="modal">
  <div class="modal-content" style="width:600px;">
    <div class="modal-header">
      <span style="font-weight:700; font-size:1.1rem; color:var(--text-main);">Batch Processing</span>
      <span class="close" onclick="closeWfModal()">&times;</span>
    </div>
    <div class="modal-body">

      <div class="form-group" style="margin-bottom:15px;">
        <label style="font-weight:600; font-size:0.85rem; color:#64748b; margin-bottom:6px; display:block;">To:</label>
        <input type="text" id="wf-to" class="tbl-input">
      </div>
      <div class="form-group" style="margin-bottom:15px;">
        <label style="font-weight:600; font-size:0.85rem; color:#64748b; margin-bottom:6px; display:block;">CC:</label>
        <input type="text" id="wf-cc" class="tbl-input">
      </div>
      <div class="form-group" style="margin-bottom:15px;">
        <label
          style="font-weight:600; font-size:0.85rem; color:#64748b; margin-bottom:6px; display:block;">Subject:</label>
        <input type="text" id="wf-subject" class="tbl-input" style="font-weight:bold;">
      </div>

      <div class="form-group" style="margin-bottom:15px;">
        <label style="font-weight:600; font-size:0.85rem; color:#64748b; margin-bottom:6px; display:block;">Email
          Preview:</label>
        <div id="wf-body"
          style="border:1px solid var(--border); padding:15px; border-radius:6px; background:var(--bg-app); max-height:200px; overflow-y:auto; font-size:0.9rem; line-height:1.5; color:var(--text-main);">
        </div>
      </div>

      <div class="form-group">
        <label
          style="font-weight:600; font-size:0.85rem; color:#64748b; margin-bottom:6px; display:block;">Attachments:</label>
        <div id="wf-attachments" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
      </div>

      <div style="text-align:right; margin-top:25px; border-top:1px solid #eee; padding-top:15px;">
        <button class="btn btn-secondary" onclick="closeWfModal()">Cancel</button>
        <button class="btn btn-success" onclick="sendBatchEmail()">
          <span class="material-icons">send</span> Send Emails
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  .chip-file {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.85rem;
    color: var(--text-main);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    transition: 0.2s;
  }

  .chip-file:hover {
    border-color: var(--primary);
  }

  .chip-upload-btn {
    cursor: pointer;
    padding: 4px;
    border-radius: 50%;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chip-upload-btn:hover {
    background: var(--bg-app);
    color: var(--primary);
  }

  .tbl-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    color: var(--text-main);
    background: var(--bg-card);
    transition: 0.2s;
  }

  .tbl-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }
</style>

<script>
  // --- XSS HELPER ---
  // Uses APP.Utils.escapeHtml instead

  let wfData = [];
  let wfSelected = new Set();
  let wfMode = 'APPROVAL'; // APPROVAL or PAYMENT

  async function loadWorkflow(force = false) {
    const btn = document.querySelector('#view-workflow .btn-secondary');
    if (btn) APP.Utils.setBtnLoading(btn, true);

    const data = await fetchData('workflowContext', 'apiGetWorkflowContext', force);

    if (data) {
      // Filter locally based on Mode
      wfData = filterWfData(data.history);
      renderWfTable();
    }
    if (btn) APP.Utils.setBtnLoading(btn, false);
  }

  function switchWorkflowMode(mode) {
    wfMode = mode;
    document.querySelectorAll('#view-workflow .sub-tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    wfSelected.clear();
    updateWfCount();
    loadWorkflow();
  }

  function filterWfData(history) {
    if (!history) return [];
    const targetStatus = (wfMode === 'APPROVAL') ? 'Pending Approval' : 'Approved';
    const term = (document.getElementById('wf-search').value || '').toLowerCase();

    return history.filter(h => {
      const s = h['Status'];
      const matchesStatus = (s === targetStatus);
      const matchesSearch = h['PO ID'].toLowerCase().includes(term) || h['Supplier'].toLowerCase().includes(term);
      return matchesStatus && matchesSearch;
    });
  }

  function renderWfTable() {
    const tbody = document.getElementById('wf-tbody');
    tbody.innerHTML = '';

    if (wfData.length === 0) {
      document.getElementById('wf-empty').classList.remove('hidden');
      return;
    }
    document.getElementById('wf-empty').classList.add('hidden');

    wfData.forEach(p => {
      const tr = document.createElement('tr');

      // Checkbox
      const tdChk = document.createElement('td');
      tdChk.style.textAlign = 'center';
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.className = 'wf-chk';
      chk.value = p['PO ID'];
      chk.checked = wfSelected.has(p['PO ID']);
      chk.onchange = () => toggleWf(p['PO ID']);
      tdChk.appendChild(chk);

      // PO ID
      const tdId = document.createElement('td');
      tdId.style.fontWeight = 'bold';
      tdId.style.color = 'var(--primary)';
      tdId.textContent = p['PO ID'];

      // Supplier
      const tdSup = document.createElement('td');
      tdSup.textContent = p['Supplier'];

      // Dept
      const tdDept = document.createElement('td');
      tdDept.textContent = p['Dept'] || '-';

      // Amount
      const tdTotal = document.createElement('td');
      tdTotal.style.textAlign = 'right';
      tdTotal.style.fontFamily = 'monospace';
      tdTotal.textContent = `RM ${Number(p['Total']).toFixed(2)}`;

      // Docs
      const tdDocs = document.createElement('td');
      tdDocs.style.display = 'flex';
      tdDocs.style.justifyContent = 'center';
      tdDocs.style.alignItems = 'center';
      tdDocs.style.gap = '10px';
      tdDocs.style.padding = '8px';

      // Helper to create icon + upload
      const createDocIcon = (url, type, label, iconName, color) => {
        const wrapper = document.createElement('div');
        wrapper.style.display = 'flex';
        wrapper.style.alignItems = 'center';
        wrapper.style.gap = '2px';

        const hasFile = !!url;
        const mainIcon = document.createElement(hasFile ? 'a' : 'span');

        if (hasFile) {
          mainIcon.href = url;
          mainIcon.target = "_blank";
          mainIcon.style.textDecoration = "none";
        } else {
          mainIcon.onclick = () => triggerWfUpload(p['PO ID'], type, false);
        }

        mainIcon.className = 'material-icons';
        mainIcon.style.fontSize = '20px';
        mainIcon.style.color = hasFile ? color : '#cbd5e1';
        mainIcon.style.cursor = 'pointer';
        mainIcon.textContent = iconName;
        mainIcon.title = hasFile ? `View ${label}` : `Upload ${label}`;

        wrapper.appendChild(mainIcon);

        // If file exists, show replace button
        if (hasFile) {
          const upIcon = document.createElement('span');
          upIcon.className = 'material-icons';
          upIcon.style.fontSize = '14px';
          upIcon.style.color = '#94a3b8';
          upIcon.style.cursor = 'pointer';
          upIcon.textContent = 'cloud_upload';
          upIcon.title = `Replace ${label}`;
          upIcon.style.marginLeft = '2px';
          upIcon.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            triggerWfUpload(p['PO ID'], type, false);
          };
          wrapper.appendChild(upIcon);
        }

        return wrapper;
      };

      tdDocs.appendChild(createDocIcon(p['Signed URL'], 'SIGNED', 'Signed PO', 'description', '#27ae60'));
      tdDocs.appendChild(createDocIcon(p['Inv URL'], 'INVOICE', 'Invoice', 'receipt', '#2980b9'));

      tr.appendChild(tdChk);
      tr.appendChild(tdId);
      tr.appendChild(tdSup);
      tr.appendChild(tdDept);
      tr.appendChild(tdTotal);
      tr.appendChild(tdDocs);

      tbody.appendChild(tr);
    });
  }

  function toggleWf(id) {
    if (wfSelected.has(id)) wfSelected.delete(id); else wfSelected.add(id);
    updateWfCount();
  }

  function toggleAllWf(source) {
    const chks = document.querySelectorAll('.wf-chk');
    chks.forEach(c => {
      c.checked = source.checked;
      if (source.checked) wfSelected.add(c.value); else wfSelected.delete(c.value);
    });
    updateWfCount();
  }

  function updateWfCount() {
    document.getElementById('wf-count').innerText = wfSelected.size;
  }

  function closeWfModal() {
    document.getElementById('wf-modal').style.display = 'none';
  }

  function initiateBatch() {
    if (wfSelected.size === 0) return APP.Utils.showToast("Select at least 1 PO.", 'failed');

    const modal = document.getElementById('wf-modal');
    document.getElementById('wf-to').value = "Loading...";
    document.getElementById('wf-body').innerHTML = '<div style="padding:20px; text-align:center; color:#64748b;">Generating Preview...</div>';
    document.getElementById('wf-attachments').innerHTML = '';

    runServer('apiGetBatchEmailPreview', Array.from(wfSelected), wfMode).then(res => {
      if (res.success) {
        const d = res.data;
        document.getElementById('wf-to').value = d.to;
        document.getElementById('wf-cc').value = d.cc;
        document.getElementById('wf-subject').value = d.subject;
        document.getElementById('wf-body').innerHTML = d.body;

        const list = document.getElementById('wf-attachments');
        if (d.attachments && d.attachments.length > 0) {
          list.innerHTML = '';
          d.attachments.forEach(file => {
            let icon = 'description';
            let color = '#64748b';
            if (file.type === 'INV') { icon = 'receipt'; color = '#2980b9'; }

            const chip = document.createElement('div');
            chip.className = 'chip-file';

            let endLinkHtml = `<a href="${file.url}" target="_blank" style="text-decoration:none; color:inherit; font-weight:600;">View</a>`;
            if (!file.url) {
              endLinkHtml = `<span style="color:#ef4444; font-weight:bold; font-size:0.75rem;">MISSING</span>`;
            }

            chip.innerHTML = `
              <span class="material-icons" style="font-size:16px; color:${color};">${icon}</span>
                ${APP.Utils.escapeHtml(file.name)}
              ${endLinkHtml}
              <div class="chip-upload-btn" onclick="triggerWfUpload('${APP.Utils.escapeHtml(file.id)}', '${file.docType}', true)" title="Replace File">
                <span class="material-icons" style="font-size:16px; color:#64748b;">cloud_upload</span>
              </div>`;
            list.appendChild(chip);
          });
        } else {
          list.innerHTML = '<span style="color:#999; font-style:italic;">No files found.</span>';
        }

        modal.style.display = 'flex';
        APP.Utils.showToast("Email preview generated.", 'success');
      } else {
        APP.Utils.showToast("Preview Error: " + res.error, 'failed');
      }
    });
  }

  function sendBatchEmail() {
    const btn = document.querySelector('#wf-modal .btn-success');
    APP.Utils.setBtnLoading(btn, true);

    const payload = {
      poIds: Array.from(wfSelected),
      mode: wfMode,
      draft: {
        to: document.getElementById('wf-to').value,
        cc: document.getElementById('wf-cc').value,
        subject: document.getElementById('wf-subject').value,
        body: document.getElementById('wf-body').innerHTML
      }
    };

    runServer('apiProcessBatchEmail', payload).then(res => {
      APP.Utils.setBtnLoading(btn, false);
      if (res.success) {
        APP.Utils.showToast(res.message, 'success');
        closeWfModal();
        wfSelected.clear();
        document.getElementById('wf-count').textContent = '0';
        loadWorkflow(true);
      } else {
        APP.Utils.showToast("Email Error: " + res.error, 'failed');
      }
    });
  }

  function triggerWfUpload(poId, docType, fromModal = false) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf';
    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (evt) {
        const base64 = evt.target.result.split(',')[1];
        const name = (docType === 'INVOICE') ? `INV_${poId}.pdf` : `${poId}.pdf`;

        runServer('apiUploadPoDoc', poId, base64, file.type, name, docType).then(res => {
          if (res.success) {
            APP.Utils.showToast(`${docType} uploaded successfully.`, 'success');
            if (fromModal) {
              initiateBatch();
            } else {
              loadWorkflow(true);
            }
          } else {
            APP.Utils.showToast("Upload Error: " + res.error, 'failed');
          }
        });
      };
      reader.readAsDataURL(file);
    };
    input.click();
  }
</script>
