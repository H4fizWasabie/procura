<script>
  // --- GLOBAL APP NAMESPACE (Encapsulation) ---
  const APP = {
    STORE: {

      inventory: [],
      suppliers: [],
      poHistory: [],
      planning: [],
      rfqContext: null,
      workflowContext: null,
      movementContext: null,
      analytics: {},
      scorecardContext: null,
      invoiceContext: null,
      adminUsers: [],
      anomalies: [],
      catalogue_sheets: [],
      dashboard: null,
      lastUpdated: {}
    },

    // Modules register themselves here
    Modules: {},

    // Utility Toolkit
    Utils: {
      escapeHtml: (text) => {
        if (text === null || text === undefined) return "";
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(text).replace(/[&<>"']/g, m => map[m]);
      },
      showLoading: (show) => {
        const el = document.getElementById('loading');
        if (el) { if (show) el.classList.remove('hidden'); else el.classList.add('hidden'); }
      },
      setBtnLoading: (btn, isLoading) => {
        if (!btn) return;
        if (isLoading) {
          btn.classList.add('loading');
          btn.disabled = true;
          if (!btn.querySelector('.btn-spinner')) {
            const spin = document.createElement('span');
            spin.className = 'btn-spinner';
            btn.appendChild(spin);
          }
        } else {
          btn.classList.remove('loading');
          btn.disabled = false;
          const spin = btn.querySelector('.btn-spinner');
          if (spin) spin.remove();
        }
      },
      showToast: (msg, type = 'info') => {
        const t = document.getElementById('toast');
        if (!t) return;

        // Reset classes
        t.className = '';
        t.classList.add(`toast-${type}`);

        let icon = 'info';
        if (type === 'success') icon = 'check_circle';
        if (type === 'saved') icon = 'save';
        if (type === 'failed') icon = 'error';

        t.innerHTML = `<span class="material-icons" style="font-size:20px;">${icon}</span> <span>${msg}</span>`;
        t.classList.remove('hidden');

        // Auto-hide
        if (APP._toastTimer) clearTimeout(APP._toastTimer);
        APP._toastTimer = setTimeout(() => t.classList.add('hidden'), 4000);
      }
    }
  };

  /**
   * Centralized Data Fetcher with Caching
   */
  async function fetchData(key, serverFunc, force = false, ...args) {
    const CACHE_TTL = 300000;
    const now = Date.now();

    const stored = APP.STORE[key];
    const hasValue = Array.isArray(stored) ? stored.length > 0 : (stored !== null && stored !== undefined && Object.keys(stored || {}).length > 0);
    if (!force && hasValue && (now - (APP.STORE.lastUpdated[key] || 0) < CACHE_TTL)) {
      return APP.STORE[key];
    }

    APP.Utils.showLoading(true);
    try {
      // PASS 'force' as the LAST argument to the server function
      const data = await runServer(serverFunc, ...args, force);
      APP.STORE[key] = data;
      APP.STORE.lastUpdated[key] = now;
      return data;
    } finally {
      APP.Utils.showLoading(false);
    }
  }

  // --- THEME & UX ENGINE ---
  function setTheme(themeName) {
    document.documentElement.setAttribute('data-theme', themeName);
    localStorage.setItem('pt_theme', themeName);
  }

  let _notifTimer = null;

  function toggleNotifications() {
    const panel = document.getElementById('notif-panel');
    panel.classList.toggle('open');

    // Clear any existing auto-hide timer
    clearTimeout(_notifTimer);

    if (panel.classList.contains('open')) {
      fetchNotifications();

      // Auto-hide after 8 seconds of inactivity
      const resetTimer = () => {
        clearTimeout(_notifTimer);
        _notifTimer = setTimeout(() => panel.classList.remove('open'), 8000);
      };
      resetTimer();
      panel.addEventListener('click', resetTimer, { once: false });
      panel._resetTimer = resetTimer; // store ref for cleanup

      // Close when clicking outside the panel
      setTimeout(() => {
        document.addEventListener('click', _closeNotifOnOutsideClick);
      }, 50);
    } else {
      if (panel._resetTimer) panel.removeEventListener('click', panel._resetTimer);
      document.removeEventListener('click', _closeNotifOnOutsideClick);
    }
  }

  function _closeNotifOnOutsideClick(e) {
    const panel = document.getElementById('notif-panel');
    if (!panel.contains(e.target)) {
      panel.classList.remove('open');
      clearTimeout(_notifTimer);
      document.removeEventListener('click', _closeNotifOnOutsideClick);
    }
  }

  async function fetchNotifications() {
    const list = document.getElementById('notif-list');
    list.innerHTML = '<div style="padding:20px; text-align:center;"><span class="btn-spinner" style="border-color:var(--primary);"></span></div>';

    runServer('apiGetSystemLogs').then(logs => {
      list.innerHTML = '';
      if (!logs || logs.length === 0) {
        list.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-muted);">No activity found.</div>';
        return;
      }

      logs.forEach(log => {
        const item = document.createElement('div');
        item.className = 'notif-item';
        item.innerHTML = `
        <div style="font-weight:600;">${log.action}</div>
        <div style="color:var(--text-muted); font-size:0.8rem;">${log.details}</div>
        <div class="notif-time">${log.time} by ${log.user}</div>
      `;
        list.appendChild(item);
      });
    }).catch(() => {
      list.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-muted);">Could not load activity.</div>';
    });
  }

  function openPdfOverlay(url) {
    if (!url) return APP.Utils.showToast("No URL provided", 'failed');

    // Convert Drive 'view' URL to 'preview' for iframe embedding
    let embedUrl = url;
    if (url.includes('drive.google.com') && url.includes('/view')) {
      embedUrl = url.replace(/\/view.*/, '/preview');
    }

    const frame = document.getElementById('pdf-frame');
    frame.src = embedUrl;
    document.getElementById('pdf-overlay').style.display = 'flex';
  }

  function closePdfOverlay() {
    document.getElementById('pdf-overlay').style.display = 'none';
    document.getElementById('pdf-frame').src = '';
  }

  // Initial UX Setups
  window.addEventListener('load', () => {
    const savedTheme = localStorage.getItem('pt_theme');
    if (savedTheme) {
      setTheme(savedTheme);
    } else {
      // AUTO-DETECT OS PREFERENCE
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (prefersDark) {
        setTheme('steel');
      } else {
        setTheme('linen');
      }
    }
  });

  // --- NAVIGATION CORE ---
  function toggleNavbar(show) {
    const nav = document.querySelector('.navbar');
    const trigger = document.getElementById('menu-trigger');
    const main = document.querySelector('.main-content');

    if (show) {
      nav.classList.remove('navbar-hidden');
      trigger.classList.remove('show');
      main.classList.remove('no-nav');
    } else {
      nav.classList.add('navbar-hidden');
      trigger.classList.add('show');
      main.classList.add('no-nav');
    }
  }

  function navTo(viewName) {
    const validViews = [
      'dashboard', 'requests', 'planning', 'rfq', 'po', 'invoice',
      'workflow', 'inventory', 'catalogue', 'movement', 'movtools',
      'suppliers', 'scorecard', 'analytics', 'report', 'admin', 'tasks', 'toast-test'
    ];

    if (!validViews.includes(viewName)) return;

    // All modules are pre-bundled in Index.html — no server call needed.
    // Just switch the view instantly.
    switchView(viewName);
  }

  /**
   * Handles the actual UI toggling and state loading
   */
  function switchView(viewName) {
    // 1. UI Switch
    document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
    const target = document.getElementById(`view-${viewName}`);
    if (target) target.classList.remove('hidden');

    // 2. Auto-Hide Navbar
    toggleNavbar(false);

    // 3. Reset Keyboard Focus
    resetKeyboardFocus();

    // 4. Data Loading - Routes
    if (viewName === 'dashboard' && typeof initDashboardView === 'function') initDashboardView();
    if (viewName === 'requests' && typeof loadRequests === 'function') loadRequests();
    if (viewName === 'inventory' && typeof loadInventoryModule === 'function') loadInventoryModule();
    if (viewName === 'workflow' && typeof loadWorkflow === 'function') loadWorkflow();
    if (viewName === 'rfq' && typeof loadRfqModule === 'function') loadRfqModule();
    if (viewName === 'po' && typeof switchPoTab === 'function') switchPoTab('form');
    if (viewName === 'invoice' && typeof loadInvoiceModule === 'function') loadInvoiceModule();
    if (viewName === 'movement' && typeof loadMovementModule === 'function') loadMovementModule();
    if (viewName === 'movtools' && typeof loadMovTools === 'function') loadMovTools();
    if (viewName === 'planning' && typeof loadPlanning === 'function') loadPlanning();
    if (viewName === 'suppliers' && typeof loadSuppliers === 'function') loadSuppliers();
    if (viewName === 'scorecard' && typeof loadScorecard === 'function') loadScorecard();
    if (viewName === 'admin' && typeof loadAdmin === 'function') {
      switchAdminTab('tools');
      loadAdmin();
    }
    if (viewName === 'analytics') {
      if (typeof loadAnalytics === 'function') loadAnalytics();
    }
    if (viewName === 'report') {
      if (typeof initReportDropdowns === 'function') initReportDropdowns();
    }
    if (viewName === 'tasks') {
      if (typeof loadTasksModule === 'function') loadTasksModule();
    }

    // 4. Show New View
    if (target) {
      target.classList.remove('hidden');
      target.classList.add('animate-enter'); // Entrance animation

      // Auto-scroll to top
      window.scrollTo(0, 0);

      // Update Navbar Active State
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.id === `nav-${viewName}`);
      });
      document.querySelectorAll('.dropdown-menu button').forEach(b => {
        const isActive = b.getAttribute('onclick') === `navTo('${viewName}')`;
        b.classList.toggle('active', isActive);
        if (isActive) {
          const parentMenu = b.closest('.dropdown-menu');
          if (parentMenu) parentMenu.classList.add('show');
        }
      });

      // Update KPI/Charts if needed
      window.dispatchEvent(new Event('viewChanged'));
    }
  }

  // --- ACCORDION LOGIC (AUTO-COLLAPSE) ---
  // This ensures that when you open a menu, all other open menus close.
  function toggleSubmenu(id) {
    const targetId = `sub-${id}`;

    // 1. Close ALL other dropdowns first
    document.querySelectorAll('.dropdown-menu').forEach(menu => {
      if (menu.id !== targetId && menu.classList.contains('show')) {
        menu.classList.remove('show');
      }
    });

    // 2. Toggle the target
    const menu = document.getElementById(targetId);
    if (menu) menu.classList.toggle('show');
  }

  // --- CLOSE DROPDOWNS ON CLICK OUTSIDE ---
  // Adds polish so menus don't stay stuck open
  window.addEventListener('click', function (e) {
    if (!e.target.closest('.nav-item')) {
      document.querySelectorAll('.dropdown-menu.show').forEach(m => m.classList.remove('show'));
    }
  });

  // --- AUTHENTICATION CLIENT ---
  let sessionCheckInterval = null;

  // --- AUTHENTICATION CLIENT ---

  function attemptLogin() {
    const email = document.getElementById('login-email').value;
    const pin = document.getElementById('login-pin').value;
    const btn = document.querySelector('.btn-login');
    const msg = document.getElementById('login-msg');

    if (!email) {
      msg.style.display = 'block';
      msg.innerText = "Please enter your email address.";
      return;
    }

    if (!pin) {
      msg.style.display = 'block';
      msg.innerText = "Please enter your PIN.";
      return;
    }

    // UI Loading
    btn.disabled = true;
    document.getElementById('login-btn-text').innerText = "Verifying...";
    msg.style.display = 'none';

    // Server Call
    runServer('apiLogin', email, pin).then(res => {
      if (res.success) {

        // CHECK FORCE PIN CHANGE
        if (res.user.mustChangePin) {
          // Store temp session for the PIN change step
          APP._tempUser = res.user;
          APP._tempToken = res.sessionToken; // If we want to auto-login after, or we just rely on curr PIN

          showChangePinPanel();
          return;
        }

        // Normal Login
        completeLogin(res.user, res.sessionToken);

      } else {
        msg.style.display = 'block';
        msg.innerText = res.error;
        btn.disabled = false;
        document.getElementById('login-btn-text').innerText = "Access System";
      }
    }).catch(e => {
      msg.style.display = 'block';
      msg.innerText = "Connection Error.";
      btn.disabled = false;
      document.getElementById('login-btn-text').innerText = "Access System";
    });
  }

  function completeLogin(user, token) {
    const now = Date.now();
    const session = {
      email: user.email,
      name: user.name,
      role: user.role,
      token: token,
      startTime: now
    };
    localStorage.setItem('pt_session', JSON.stringify(session));
    unlockApp(session);
  }

  // --- PANEL SWITCHING ---
  function showLoginPanel() {
    hideAllPanels();
    document.getElementById('login-main-view').style.display = 'block';
    document.getElementById('login-footer-links').style.display = 'block';
  }

  function showResetPanel() {
    hideAllPanels();
    document.getElementById('login-reset-panel').style.display = 'flex';
    // Pre-fill email
    const email = document.getElementById('login-email').value;
    if (email) document.getElementById('reset-email').value = email;
    resetMsg('reset');
  }

  function showRegisterPanel() {
    hideAllPanels();
    document.getElementById('login-register-panel').style.display = 'flex';
    resetMsg('reg');
  }

  function showChangePinPanel() {
    hideAllPanels();
    document.getElementById('login-changepin-panel').style.display = 'flex';
    document.getElementById('login-footer-links').style.display = 'none';

    // Pre-fill current PIN to save typing if we can (optional security trade-off)
    // document.getElementById('cp-old').value = document.getElementById('login-pin').value;
    document.getElementById('cp-old').focus();
    resetMsg('cp');
  }

  function hideAllPanels() {
    const panels = ['login-main-view', 'login-reset-panel', 'login-register-panel', 'login-changepin-panel'];
    panels.forEach(id => document.getElementById(id).style.display = 'none');
  }

  function resetMsg(prefix) {
    const msg = document.getElementById(`${prefix}-msg`);
    if (msg) {
      msg.style.display = 'none';
      msg.innerText = '';
      msg.className = '';
    }
    const btn = document.getElementById(`${prefix}-btn-text`);
    // Reset button text basic logic
    if (prefix === 'reg') btn.innerText = "Request Access";
    if (prefix === 'reset') btn.innerText = "Send Reset Email";
    if (prefix === 'cp') btn.innerText = "Update PIN & Login";

    // Enable buttons
    const b = btn.parentElement;
    if (b) b.disabled = false;
  }

  // --- ACTIONS ---

  function startRegistration() {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const dept = document.getElementById('reg-dept').value;
    const btn = document.querySelector('#login-register-panel button');
    const msg = document.getElementById('reg-msg');

    if (!name || !email || !dept) {
      msg.style.display = 'block';
      msg.style.color = '#ef4444';
      msg.innerText = "Please fill in all fields.";
      return;
    }

    btn.disabled = true;
    document.getElementById('reg-btn-text').innerText = "Processing...";
    msg.style.display = 'none';

    runServer('apiRegisterUser', { name, email, dept }).then(res => {
      btn.disabled = false;
      document.getElementById('reg-btn-text').innerText = "Request Access";

      if (res.success) {
        msg.style.display = 'block';
        msg.style.color = '#10b981';
        msg.innerHTML = `✅ <b>Success!</b><br>A temporary PIN has been sent to ${email}.<br><span style="text-decoration:underline; cursor:pointer;" onclick="showLoginPanel()">Return to Login</span>`;
        btn.style.display = 'none';
      } else {
        msg.style.display = 'block';
        msg.style.color = '#ef4444';
        msg.innerText = res.error;
      }
    }).catch(e => {
      btn.disabled = false;
      msg.style.display = 'block';
      msg.innerText = "Error: " + e.message;
    });
  }

  function doChangePin() {
    const oldPin = document.getElementById('cp-old').value.trim();
    const newPin = document.getElementById('cp-new').value.trim();
    const confirm = document.getElementById('cp-confirm').value.trim();
    const btn = document.querySelector('#login-changepin-panel button');
    const msg = document.getElementById('cp-msg');

    if (!oldPin || !newPin || !confirm) {
      msg.style.display = 'block';
      msg.style.color = '#ef4444';
      msg.innerText = "All fields are required.";
      return;
    }

    if (newPin !== confirm) {
      msg.style.display = 'block';
      msg.style.color = '#ef4444';
      msg.innerText = "New PINs do not match.";
      return;
    }

    if (newPin.length < 6) {
      msg.style.display = 'block';
      msg.style.color = '#ef4444';
      msg.innerText = "New PIN must be at least 6 digits.";
      return;
    }

    btn.disabled = true;
    document.getElementById('cp-btn-text').innerText = "Updating...";
    msg.style.display = 'none';

    const email = APP._tempUser ? APP._tempUser.email : document.getElementById('login-email').value;

    runServer('apiChangePin', email, oldPin, newPin).then(res => {
      if (res.success) {
        msg.style.display = 'block';
        msg.style.color = '#10b981';
        msg.innerText = "✅ PIN Updated! Logging you in...";

        // Auto Login with new PIN
        setTimeout(() => {
          completeLogin(APP._tempUser, APP._tempToken); // We reuse the token we got from the first step? 
          // Actually, usually valid, but safer to re-login if we wanted strictness. 
          // For UX, let's just use the user object we have, assuming token is valid.
        }, 1000);

      } else {
        msg.style.display = 'block';
        msg.style.color = '#ef4444';
        msg.innerText = res.error;
        btn.disabled = false;
        document.getElementById('cp-btn-text').innerText = "Update PIN & Login";
      }
    }).catch(e => {
      btn.disabled = false;
      msg.style.display = 'block';
      msg.innerText = "Connection Error.";
    });
  }

  function sendPasswordReset() {
    const email = document.getElementById('reset-email').value.trim();
    const btn = document.querySelector('.btn-reset');
    const msg = document.getElementById('reset-msg');

    if (!email) {
      msg.style.display = 'block';
      msg.style.color = '#ef4444';
      msg.innerText = 'Please enter your email address.';
      return;
    }

    btn.disabled = true;
    document.getElementById('reset-btn-text').innerText = 'Sending...';
    msg.style.display = 'none';

    runServer('apiResetPin', email).then(res => {
      btn.disabled = false;
      document.getElementById('reset-btn-text').innerText = 'Send Reset Email';
      if (res.success) {
        msg.style.display = 'block';
        msg.style.color = '#10b981';
        msg.innerText = '✅ If that email is registered, a new PIN has been sent. Check your inbox.';
        btn.style.display = 'none';
      } else {
        msg.style.display = 'block';
        msg.style.color = '#ef4444';
        msg.innerText = res.error || 'Something went wrong. Please try again.';
      }
    }).catch(() => {
      btn.disabled = false;
      document.getElementById('reset-btn-text').innerText = 'Send Reset Email';
      msg.style.display = 'block';
      msg.style.color = '#ef4444';
      msg.innerText = 'Connection error. Please try again.';
    });
  }

  function unlockApp(session) {
    document.getElementById('login-overlay').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('app-shell').classList.remove('hidden');

      // Set User Info
      document.querySelector('.user-name').innerText = session.name;
      document.getElementById('display-role').innerText = session.role;

      // Show admin-only nav items
      if (session.role === 'ADMIN') {
        const toastBtn = document.getElementById('nav-toast-test');
        if (toastBtn) toastBtn.style.display = '';
      }

      // Show Navbar Initially
      toggleNavbar(true);

      // 1. Load Dashboard
      navTo('dashboard');

      // 2. BACKGROUND WARM-UP (Pro-Load)
      warmUpMasterData();
    }, 400);
  }

  /**
   * Silently fetches master data and warms up main trackers
   */
  async function warmUpMasterData() {
    console.log("Initializing Pro-Load sequence...");

    try {
      // 1. Get the Golden Bundle (Suppliers + Item Master + Dashboard)
      const bootstrap = await runServer('apiGetAppBootstrapData');
      APP.STORE.suppliers = bootstrap.suppliers;
      APP.STORE.inventory = bootstrap.items;
      APP.STORE.dashboard = bootstrap.dashboard;
      APP.STORE.lastUpdated['suppliers'] = bootstrap.timestamp;
      APP.STORE.lastUpdated['inventory'] = bootstrap.timestamp;
      APP.STORE.lastUpdated['dashboard'] = bootstrap.timestamp;

      console.log("Master Data cached (incl. dashboard). Warming up trackers...");

      // 2. Silently fetch first page of heavy trackers
      fetchData('requests', 'apiGetRequests');

    } catch (e) {
      console.warn("Warm-up interrupted: ", e.message);
    }
  }

  function initConfig() {
    // Load Saved Theme
    const savedTheme = localStorage.getItem('pt_theme') || 'linen';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);

    // Load Saved Session
    const sessionRaw = localStorage.getItem('pt_session');
    if (sessionRaw) {
      try {
        const session = JSON.parse(sessionRaw);
        // Check Expiry (8 Hours)
        const SESSION_TTL = 8 * 60 * 60 * 1000;
        if (!session.startTime || (Date.now() - session.startTime > SESSION_TTL)) {
          console.warn("Session expired.");
          doLogout();
          return;
        }
        unlockApp(session);
      } catch (e) {
        console.error("Failed to parse session from localStorage:", e);
        doLogout(); // Clear invalid session
      }
    }
  }

  function doLogout() {
    // 1. Clear session
    localStorage.removeItem('pt_session');

    // 2. Reset UI State
    document.getElementById('app-shell').classList.add('hidden');
    document.getElementById('login-overlay').style.display = 'flex';
    document.getElementById('login-overlay').style.opacity = '1';

    // 3. Clear sensitive inputs
    document.getElementById('login-pin').value = '';
    document.getElementById('login-btn-text').innerText = "Access System";
    document.querySelector('.btn-login').disabled = false;

    // 4. Reset Global STORE
    for (let key in APP.STORE) {
      if (Array.isArray(APP.STORE[key])) APP.STORE[key] = [];
      else if (typeof APP.STORE[key] === 'object' && APP.STORE[key] !== null) APP.STORE[key] = {};
    }
    APP.STORE.lastUpdated = {};

    APP.Utils.showToast("Logged out safely.");
  }

  // --- API WRAPPER ---
  function runServer(funcName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(res => resolve(res))
        .withFailureHandler(err => {
          APP.Utils.showToast("Error: " + err.message);
          reject(err);
        })
      [funcName](...args);
    });
  }

  // --- KEYBOARD NAVIGATION ENGINE ---
  let currentFocusIndex = -1;

  // --- DRAFT AUTOSAVE MANAGER ---
  const DraftManager = {
    save: (module, data) => {
      const draft = { timestamp: Date.now(), data };
      localStorage.setItem(`draft_${module}`, JSON.stringify(draft));
    },
    load: (module) => {
      const raw = localStorage.getItem(`draft_${module}`);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch (e) {
        console.warn(`Corrupted draft for ${module}, clearing.`);
        localStorage.removeItem(`draft_${module}`);
        return null;
      }
    },
    clear: (module) => {
      localStorage.removeItem(`draft_${module}`);
    },
    checkAndPrompt: (module, restoreCallback) => {
      const draft = DraftManager.load(module);
      if (!draft) return;

      const time = new Date(draft.timestamp).toLocaleTimeString();
      if (confirm(`Found an unsaved draft for ${module.toUpperCase()} from ${time}. Restore it?`)) {
        restoreCallback(draft.data);
      } else {
        DraftManager.clear(module);
      }
    }
  };

  function resetKeyboardFocus() {
    currentFocusIndex = -1;
    const items = document.querySelectorAll('.kb-focus');
    items.forEach(el => el.classList.remove('kb-focus'));
  }

  document.addEventListener('keydown', function (e) {
    // Only navigate if a modal is not blocking (optional check)
    const modals = document.querySelectorAll('.modal[style*="block"]');
    if (modals.length > 0) return;

    const activeView = document.querySelector('.view-section:not(.hidden)');
    if (!activeView) return;

    // Find all selectable items in active view
    const selectables = Array.from(activeView.querySelectorAll('.selectable-item, .inv-row-clickable, tr[onclick], .dash-btn'));
    if (selectables.length === 0) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      currentFocusIndex = (currentFocusIndex + 1) % selectables.length;
      updateVisualFocus(selectables);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      currentFocusIndex = (currentFocusIndex - 1 + selectables.length) % selectables.length;
      updateVisualFocus(selectables);
    } else if (e.key === 'Enter') {
      if (currentFocusIndex > -1) {
        e.preventDefault();
        selectables[currentFocusIndex].click();
      }
    }
  });

  function updateVisualFocus(items) {
    items.forEach(el => el.classList.remove('kb-focus'));
    if (currentFocusIndex > -1) {
      const target = items[currentFocusIndex];
      target.classList.add('kb-focus');
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  //* --- THEME ENGINE --- */
  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'linen';
    let next = 'linen';

    if (current === 'linen') next = 'dark';
    else if (current === 'dark') next = 'sage';
    else if (current === 'sage') next = 'steel';
    else if (current === 'steel') next = 'linen';

    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('pt_theme', next);
    updateThemeIcon(next);

    // Notify Charts to re-render
    window.dispatchEvent(new Event('themeChanged'));
  }

  function updateThemeIcon(theme) {
    const icon = document.getElementById('theme-icon');
    if (!icon) return;

    if (theme === 'dark') icon.innerText = 'light_mode';
    else if (theme === 'sage') icon.innerText = 'spa';
    else if (theme === 'steel') icon.innerText = 'water_drop';
    else icon.innerText = 'dark_mode';
  }

  /* --- UTILS --- */
  // --- VISUAL UTILS (Aliased to APP.Utils for backward compatibility) ---
  const showLoading = APP.Utils.showLoading;
  const setBtnLoading = APP.Utils.setBtnLoading;
  const showToast = APP.Utils.showToast;
</script>
