<div id="view-suppliers" class="view-section hidden">
  <div class="module-header">
    <h2><span class="material-icons">store</span> Supplier Management</h2>
  </div>

  <div class="card">
    <div class="action-bar"
      style="border-bottom:1px solid #e2e8f0; padding:15px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center;">
      <div class="search-wrapper" style="width:300px; position:relative;">
        <span class="material-icons" style="position:absolute; left:12px; top:12px; color:#94a3b8;">search</span>
        <input type="text" id="sup-search" class="tbl-input" style="padding-left:40px;"
          placeholder="Search Suppliers..." onkeyup="filterSuppliers()">
      </div>
      <button class="btn btn-primary" onclick="openSupplierModal()">
        <span class="material-icons">add_business</span> New Supplier
      </button>
    </div>

    <div class="table-responsive" style="height: calc(100vh - 260px); overflow-y: auto;">
      <table class="modern-table">
        <thead>
          <tr>
            <th>Supplier Name</th>
            <th>Contact Person</th>
            <th>Email / Phone</th>
            <th>Payment Terms</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="suppliers-tbody"></tbody>
      </table>
      <div id="sup-loading" class="empty-state hidden" style="padding:40px; text-align:center; color:#94a3b8;">
        <span class="btn-spinner"
          style="border-color:var(--primary); width:24px; height:24px; display:inline-block;"></span> Loading...
      </div>
    </div>
  </div>
</div>

<div id="sup-modal" class="modal">
  <div class="modal-content" style="width: 550px;">
    <div class="modal-header">
      <span id="sup-modal-title" style="font-size:1.1rem; font-weight:700; color:var(--text-main);">Supplier
        Details</span>
      <span class="close" onclick="closeSupModal()">&times;</span>
    </div>
    <div class="modal-body">
      <form id="sup-form" onsubmit="handleSupSubmit(event)">
        <input type="hidden" name="original_name" id="sup-original-name">

        <div class="form-group" style="margin-bottom:15px;">
          <label class="form-lbl">Supplier Name *</label>
          <input type="text" name="supplier_name" id="sup-name" class="tbl-input" required
            placeholder="e.g. Chemzol Sdn Bhd">
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-lbl">Contact Person</label>
            <input type="text" name="contact_person" id="sup-contact" class="tbl-input">
          </div>
          <div class="form-group">
            <label class="form-lbl">Payment Terms</label>
            <select name="payment_terms" id="sup-terms" class="tbl-input">
              <option value="COD">Cash on Delivery</option>
              <option value="30 Days">30 Days</option>
              <option value="60 Days">60 Days</option>
              <option value="Prepaid">Prepaid</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-lbl">Phone</label>
            <input type="text" name="phone" id="sup-phone" class="tbl-input">
          </div>
          <div class="form-group">
            <label class="form-lbl">Email</label>
            <input type="email" name="email" id="sup-email" class="tbl-input">
          </div>
        </div>

        <div class="form-group" style="margin-bottom:15px;">
          <label class="form-lbl">Address</label>
          <textarea name="address" id="sup-address" class="tbl-input" style="height:70px; resize:none;"></textarea>
        </div>

        <div
          style="background:var(--bg-app); padding:20px; border-radius:8px; border:1px solid var(--border); margin-bottom:15px;">
          <label
            style="margin-bottom:12px; display:block; font-weight:700; color:var(--primary); font-size:0.85rem;">Banking
            & Registration</label>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-lbl">Bank Name</label>
              <input type="text" name="bank_name" id="sup-bank" class="tbl-input">
            </div>
            <div class="form-group">
              <label class="form-lbl">Account No</label>
              <input type="text" name="account_no" id="sup-acc" class="tbl-input">
            </div>
          </div>
          <div class="form-group" style="margin-bottom:0; margin-top:15px;">
            <label class="form-lbl">BRN (Reg No)</label>
            <input type="text" name="brn" id="sup-brn" class="tbl-input">
          </div>
        </div>

        <div class="modal-footer" style="padding-top:15px;">
          <button type="button" class="btn btn-secondary" onclick="closeSupModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Supplier</button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 15px;
  }

  .form-lbl {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .tbl-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    color: var(--text-main);
    background: var(--bg-card);
    transition: 0.2s;
  }

  .tbl-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  @media(max-width: 600px) {
    .grid-2 {
      grid-template-columns: 1fr;
    }
  }
</style>

<script>
  const supModal = document.getElementById('sup-modal');

  // --- LOAD ---
  async function loadSuppliers(force = false) {
    const tbody = document.getElementById('suppliers-tbody');
    document.getElementById('sup-loading').classList.remove('hidden');

    if (force) tbody.innerHTML = '';

    const data = await fetchData('suppliers', 'apiGetSuppliers', force);
    renderSuppliers(data);
    document.getElementById('sup-loading').classList.add('hidden');
  }

  function renderSuppliers(data) {
    const tbody = document.getElementById('suppliers-tbody');
    tbody.innerHTML = '';

    if (data.length === 0) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="5" class="text-center" style="padding:30px; color:var(--text-muted);">No suppliers found. Click "New Supplier" to add one.</td>';
      tbody.appendChild(tr);
      return;
    }

    data.forEach(row => {
      const tr = document.createElement('tr');

      // Create Cells with textContent for security
      const tdName = document.createElement('td');
      tdName.style.fontWeight = '700';
      tdName.style.color = 'var(--primary)';
      tdName.style.fontSize = '0.95rem';
      tdName.textContent = row['Supplier Name'];

      const tdContact = document.createElement('td');
      tdContact.style.color = 'var(--text-main)';
      tdContact.textContent = row['Contact Person'] || '-';

      const tdEmail = document.createElement('td');
      tdEmail.innerHTML = `<div style="font-weight:500;">${APP.Utils.escapeHtml(row['Email'] || '')}</div><small style="color:var(--text-muted);">${APP.Utils.escapeHtml(row['Phone'] || '')}</small>`;

      const tdTerms = document.createElement('td');
      tdTerms.innerHTML = `<span class="status-badge" style="background:var(--bg-app); color:var(--text-muted);">${APP.Utils.escapeHtml(row['Payment Terms'] || 'COD')}</span>`;

      const tdActions = document.createElement('td');
      const editBtn = document.createElement('button');
      editBtn.className = 'btn btn-sm btn-secondary';
      editBtn.innerHTML = '<span class="material-icons" style="font-size:16px">edit</span> Edit';
      editBtn.onclick = () => editSupplier(row);
      tdActions.appendChild(editBtn);

      tr.appendChild(tdName);
      tr.appendChild(tdContact);
      tr.appendChild(tdEmail);
      tr.appendChild(tdTerms);
      tr.appendChild(tdActions);

      tbody.appendChild(tr);
    });
  }

  function filterSuppliers() {
    const term = document.getElementById('sup-search').value.toLowerCase();
    const filtered = APP.STORE.suppliers.filter(s =>
      s['Supplier Name'].toLowerCase().includes(term) ||
      (s['Contact Person'] && s['Contact Person'].toLowerCase().includes(term))
    );
    renderSuppliers(filtered);
  }

  // --- MODAL ACTIONS ---
  function openSupplierModal() {
    document.getElementById('sup-form').reset();
    document.getElementById('sup-original-name').value = ""; // Clear Key
    document.getElementById('sup-modal-title').textContent = "New Supplier";
    supModal.style.display = 'block';
  }

  function editSupplier(row) {
    document.getElementById('sup-original-name').value = row['Supplier Name']; // KEY
    document.getElementById('sup-name').value = row['Supplier Name'];
    document.getElementById('sup-contact').value = row['Contact Person'];
    document.getElementById('sup-phone').value = row['Phone'];
    document.getElementById('sup-email').value = row['Email'];
    document.getElementById('sup-address').value = row['Address'];
    document.getElementById('sup-terms').value = row['Payment Terms'];
    document.getElementById('sup-bank').value = row['Bank Name'];
    document.getElementById('sup-acc').value = row['Account No'];
    document.getElementById('sup-brn').value = row['BRN'];

    document.getElementById('sup-modal-title').textContent = "Edit Supplier";
    supModal.style.display = 'block';
  }

  function closeSupModal() {
    supModal.style.display = 'none';
  }

  function handleSupSubmit(e) {
    e.preventDefault();
    const form = document.getElementById('sup-form');
    const formData = {
      original_name: form.original_name.value,
      supplier_name: form.supplier_name.value,
      contact_person: form.contact_person.value,
      phone: form.phone.value,
      email: form.email.value,
      address: form.address.value,
      payment_terms: form.payment_terms.value,
      bank_name: form.bank_name.value,
      account_no: form.account_no.value,
      brn: form.brn.value
    };

    const btn = form.querySelector('button[type="submit"]');
    const originalText = btn.textContent;
    btn.textContent = "Saving...";
    btn.disabled = true;

    runServer('apiSaveSupplier', formData).then(res => {
      btn.textContent = originalText;
      btn.disabled = false;

      if (res.success) {
        APP.Utils.showToast("Supplier saved successfully.", 'saved');
        closeSupModal();
        loadSuppliers(true);
      } else {
        APP.Utils.showToast("Save Error: " + res.error, 'failed');
      }
    }).catch(err => {
      btn.textContent = originalText;
      btn.disabled = false;
      APP.Utils.showToast("Connection Error: " + err.message, 'failed');
    });
  }
</script>
