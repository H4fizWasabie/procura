<div id="view-rfq" class="view-section hidden">
  <div class="module-header">
    <h2><span class="material-icons">send</span> Create RFQ</h2>
    <div class="action-bar"
      style="background:#fff; border:1px solid #eee; border-radius:8px; padding:10px; display:flex; justify-content:flex-end; gap:10px;">
      <button class="btn btn-secondary" onclick="addRfqRow()">
        <span class="material-icons">add</span> Add Item
      </button>
      <button class="btn btn-secondary" onclick="resetRfqForm()">
        <span class="material-icons">refresh</span> Reset
      </button>

      <button class="btn btn-primary" onclick="saveRfq()">
        <span class="material-icons">save</span> Save Draft
      </button>
      <button class="btn btn-warning" onclick="generateRfqPdf()">
        <span class="material-icons">picture_as_pdf</span> PDF
      </button>
    </div>
  </div>

  <div class="card" style="margin-top:20px; padding:25px;">
    <form id="rfq-form">
      <div style="display:grid; grid-template-columns: 1fr 2fr; gap:20px; margin-bottom:25px;">
        <div class="form-group">
          <label
            style="font-size:0.8rem; font-weight:700; color:var(--secondary); text-transform:uppercase; display:block; margin-bottom:6px;">RFQ
            ID (Auto/Edit)</label>
          <input type="text" id="rfq-id" class="tbl-input" onchange="checkRfqId()"
            style="font-family:'Segoe UI', monospace; font-weight:700; color:var(--text-main); background:#f8fafc;"
            placeholder="Auto-generated">
        </div>
        <div class="form-group">
          <label
            style="font-size:0.8rem; font-weight:700; color:var(--secondary); text-transform:uppercase; display:block; margin-bottom:6px;">Supplier
            Name</label>
          <input type="text" id="rfq-supplier" class="tbl-input" list="rfq-sup-list"
            placeholder="Type to search supplier..." style="font-weight:600;">
          <datalist id="rfq-sup-list"></datalist>
        </div>
      </div>

      <div class="table-responsive"
        style="height: calc(100vh - 320px); overflow-y: auto; border:1px solid #e0e0e0; border-radius:8px;">
        <table class="modern-table">
          <thead>
            <tr>
              <th style="width:15%">Stock ID</th>
              <th style="width:50%">Item Name (Type to Search)</th>
              <th style="width:15%">UOM</th>
              <th style="width:15%">Qty</th>
              <th style="width:5%"></th>
            </tr>
          </thead>
          <tbody id="rfq-tbody"></tbody>
        </table>
        <div id="rfq-empty" style="padding:40px; text-align:center; color:#94a3b8; font-style:italic;">
          <span class="material-icons"
            style="font-size:40px; display:block; margin-bottom:10px; opacity:0.5;">playlist_add</span>
          Use the top toolbar to add more items.
        </div>
      </div>
    </form>
  </div>
</div>

<datalist id="rfq-item-list"></datalist>

<script>
  let rfqItems = [];

  async function loadRfqModule(force = false) {
    const resetBtn = document.querySelector('#view-rfq .btn-secondary:nth-child(2)');
    if (resetBtn) APP.Utils.setBtnLoading(resetBtn, true);

    const data = await fetchData('rfqContext', 'apiGetRFQContext', force);

    if (data) {
      const supList = document.getElementById('rfq-sup-list');
      supList.innerHTML = '';
      data.suppliers.forEach(s => supList.appendChild(new Option(s['Supplier Name'])));

      const itemList = document.getElementById('rfq-item-list');
      itemList.innerHTML = '';
      data.items.forEach(i => itemList.appendChild(new Option(i['Item Name'])));

      if (!document.getElementById('rfq-id').value) {
        document.getElementById('rfq-id').value = data.newId;
      }

      // --- CART CHECK ---
      const rawCart = localStorage.getItem('rfq_cart');
      if (rawCart) {
        const cart = JSON.parse(rawCart);
        if (cart.supplier) document.getElementById('rfq-supplier').value = cart.supplier;
        rfqItems = cart.items || [];
        renderRfqRows();
        APP.Utils.showToast("Items loaded from Planning.", 'success');
        localStorage.removeItem('rfq_cart');
      } else {
        // --- DRAFT RESTORE ---
        DraftManager.checkAndPrompt('rfq', (draftData) => {
          document.getElementById('rfq-id').value = draftData.rfq_id;
          document.getElementById('rfq-supplier').value = draftData.supplier;
          rfqItems = draftData.items;
          renderRfqRows();
        });

        if (rfqItems.length === 0) {
          rfqItems = [];
          renderRfqRows();
        }
      }
    }

    if (resetBtn) APP.Utils.setBtnLoading(resetBtn, false);
  }

  // Trigger Autosave on RFQ Form
  document.getElementById('rfq-form').addEventListener('input', () => {
    const draftData = {
      rfq_id: document.getElementById('rfq-id').value,
      supplier: document.getElementById('rfq-supplier').value,
      items: rfqItems
    };
    DraftManager.save('rfq', draftData);
  });

  function checkRfqId() {
    const id = document.getElementById('rfq-id').value.trim();
    if (id.length > 5) { // Adjusted from 10 to be more flexible
      runServer('apiGetRFQDetails', id).then(res => {
        if (res.success) {
          if (confirm(`RFQ ${id} found. Load for editing?`)) {
            document.getElementById('rfq-supplier').value = res.data.supplier;
            // Map short keys (id, n, u, q) from backend to long keys (stockId, name, uom, qty) used in frontend
            rfqItems = res.data.items.map(i => ({
              stockId: i.id || '',
              name: i.n || '',
              uom: i.u || '',
              qty: i.q || ''
            }));
            renderRfqRows();
            APP.Utils.showToast("RFQ loaded successfully.", 'success');
          }
        }
      });
    }
  }

  function addRfqRow() {
    if (rfqItems.length >= 15) {
      APP.Utils.showToast("Maximum 15 items allowed per RFQ for A4 layout.", 'failed');
      return;
    }
    rfqItems.push({ stockId: '', name: '', uom: '', qty: '' });
    renderRfqRows();
  }

  function removeRfqRow(idx) {
    rfqItems.splice(idx, 1);
    renderRfqRows();
  }

  function renderRfqRows() {
    const tbody = document.getElementById('rfq-tbody');
    tbody.innerHTML = '';

    if (rfqItems.length === 0) {
      document.getElementById('rfq-empty').style.display = 'block';
    } else {
      document.getElementById('rfq-empty').style.display = 'none';
      rfqItems.forEach((item, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
        <td><input type="text" class="tbl-input" value="${item.stockId}" readonly style="background:#f8fafc; color:#64748b; font-size:0.8rem; border-color:transparent; font-weight:600;"></td>
        <td>
          <input type="text" class="tbl-input" list="rfq-item-list" value="${item.name}" 
                 onchange="onRfqItemSelect(${idx}, this)" placeholder="Search Name or ID..."
                 style="font-size:0.9rem;">
        </td>
        <td><input type="text" class="tbl-input" value="${item.uom}" onchange="rfqItems[${idx}].uom = this.value" style="font-size:0.9rem;"></td>
        <td><input type="number" class="tbl-input" value="${item.qty}" onchange="rfqItems[${idx}].qty = this.value" style="font-weight:700; color:var(--primary); font-size:0.9rem;"></td>
        <td class="text-center">
          <button type="button" class="btn btn-sm btn-danger" onclick="removeRfqRow(${idx})" style="padding:4px 8px; border-radius:4px;">
            <span class="material-icons" style="font-size:16px;">delete_outline</span>
          </button>
        </td>
      `;
        tbody.appendChild(tr);
      });
    }
  }

  function onRfqItemSelect(idx, input) {
    const val = input.value.trim();
    if (!val) return;

    // Search by Name or Stock ID
    const match = APP.STORE.rfqContext.items.find(i =>
      String(i['Item Name']).toLowerCase() === val.toLowerCase() ||
      String(i['Stock ID']).toLowerCase() === val.toLowerCase()
    );

    if (match) {
      rfqItems[idx].stockId = match['Stock ID'];
      rfqItems[idx].name = match['Item Name'];
      rfqItems[idx].uom = match['UOM'] || '';
      renderRfqRows();
    } else {
      // Keep custom entry if no match
      rfqItems[idx].name = val;
    }
  }

  function resetRfqForm() {
    document.getElementById('rfq-id').value = "";
    document.getElementById('rfq-supplier').value = "";
    rfqItems = [];
    DraftManager.clear('rfq');
    renderRfqRows();
    loadRfqModule(true);
  }

  function saveRfq() {
    if (rfqItems.length === 0) return APP.Utils.showToast("Add at least 1 item.", 'failed');
    if (!document.getElementById('rfq-supplier').value) return APP.Utils.showToast("Select a supplier.", 'failed');

    const btn = event.currentTarget;
    APP.Utils.setBtnLoading(btn, true);

    const formData = {
      rfq_id: document.getElementById('rfq-id').value,
      supplier: document.getElementById('rfq-supplier').value,
      items: rfqItems
    };

    runServer('apiSaveRFQ', formData).then(res => {
      APP.Utils.setBtnLoading(btn, false);
      if (res.success) {
        APP.Utils.showToast("RFQ saved successfully.", 'saved');
        DraftManager.clear('rfq');
      } else {
        APP.Utils.showToast("Save Error: " + res.error, 'failed');
      }
    }).catch(err => {
      APP.Utils.setBtnLoading(btn, false);
      APP.Utils.showToast("Error: " + err.message, 'failed');
    });
  }

  function generateRfqPdf() {
    const rfqId = document.getElementById('rfq-id').value;
    if (!rfqId) return APP.Utils.showToast("RFQ ID missing.", 'failed');

    if (!confirm("Generate PDF for " + rfqId + "?\nNote: Ensure you have SAVED any changes first.")) return;

    const btn = event.currentTarget;
    APP.Utils.setBtnLoading(btn, true);

    runServer('apiGenerateRfqPdf', rfqId).then(res => {
      APP.Utils.setBtnLoading(btn, false);
      if (res.success) {
        // Check if it's a blob URL (fallback when folder access fails)
        if (res.isBlob) {
          // Download the blob directly
          const link = document.createElement('a');
          link.href = res.url;
          link.download = `${rfqId}.pdf`;
          link.click();
          APP.Utils.showToast("RFQ PDF downloaded successfully.", 'success');
        } else {
          // Open in PDF overlay (normal Drive URL)
          openPdfOverlay(res.url);
          APP.Utils.showToast("RFQ PDF generated successfully.", 'success');
        }
      } else {
        APP.Utils.showToast("PDF Error: " + res.error, 'failed');
      }
    }).catch(err => {
      APP.Utils.setBtnLoading(btn, false);
      APP.Utils.showToast("Error: " + err.message, 'failed');
    });
  }
</script>
